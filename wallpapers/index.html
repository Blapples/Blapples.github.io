/* ---------- Card hover preview ----------
 * Desktop only: hovering a card for a moment shows a floating preview of
 * the full, uncropped image near the cursor (the grid tile itself is
 * cropped to a square/rectangle via object-fit:cover, so this is the only
 * way to see the whole shot without opening it). Touch devices don't get
 * this at all - a tap just opens the lightbox directly, so there's no
 * long-press step to learn or accidentally trigger while scrolling.
 */
const cardPreviewEl = document.createElement('div');
cardPreviewEl.className = 'card-preview-float';
cardPreviewEl.setAttribute('aria-hidden', 'true');
const cardPreviewImg = document.createElement('img');
cardPreviewImg.alt = '';
cardPreviewEl.appendChild(cardPreviewImg);
document.body.appendChild(cardPreviewEl);

const supportsHoverPreview = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
let hoverPreviewTimer = null;
let hoverPreviewCard = null;
let suppressNextCardClick = false;

function positionCardPreview(x, y){
  // Offset from the cursor and clamped to the viewport so the preview
  // never gets clipped off the edge of the screen near the grid borders.
  const margin = 16;
  const rect = cardPreviewEl.getBoundingClientRect();
  const w = rect.width || 320;
  const h = rect.height || 320;
  let left = x + 18;
  let top = y + 18;
  if(left + w + margin > window.innerWidth) left = x - w - 18;
  if(top + h + margin > window.innerHeight) top = y - h - 18;
  left = Math.max(margin, Math.min(left, window.innerWidth - w - margin));
  top = Math.max(margin, Math.min(top, window.innerHeight - h - margin));
  cardPreviewEl.style.transform = cardPreviewEl.classList.contains('is-visible')
    ? `translate(${left}px, ${top}px) scale(1)`
    : `translate(${left}px, ${top}px) scale(.94)`;
}
function showCardPreview(frame, x, y){
  if(!frame) return;
  cardPreviewImg.src = frame.previewSrc || frame.src;
  cardPreviewImg.alt = frame.title || '';
  cardPreviewEl.style.left = '0';
  cardPreviewEl.style.top = '0';
  positionCardPreview(x, y);
  requestAnimationFrame(()=>{
    cardPreviewEl.classList.add('is-visible');
    positionCardPreview(x, y);
  });
}
function hideCardPreview(){
  cardPreviewEl.classList.remove('is-visible');
  hoverPreviewCard = null;
}

// Attaches the hover preview behavior to one card. Shared by both
// buildCard and buildNewSectionCard so the two grids behave the same.
function wireCardPreview(card, frame){
  if(!supportsHoverPreview) return;
  card.addEventListener('pointerenter', e => {
    if(e.pointerType !== 'mouse') return;
    clearTimeout(hoverPreviewTimer);
    hoverPreviewTimer = setTimeout(()=>{
      hoverPreviewCard = card;
      showCardPreview(frame, e.clientX, e.clientY);
    }, 450);
  });
  card.addEventListener('pointermove', e => {
    if(e.pointerType !== 'mouse') return;
    if(hoverPreviewCard === card) positionCardPreview(e.clientX, e.clientY);
  });
  card.addEventListener('pointerleave', () => {
    clearTimeout(hoverPreviewTimer);
    if(hoverPreviewCard === card) hideCardPreview();
  });
}

/* ---------- Cursor trail ----------
 * A faint trail of little paw marks follows the pointer while it moves
 * over the gallery grid — desktop only, purely decorative, and throttled
 * to a low spawn rate so it never turns into a flood of DOM elements; each
 * mark fades out well before the throttle window would let another spawn
 * at the same spot anyway. */
if(supportsHoverPreview && !window.matchMedia('(prefers-reduced-motion:reduce)').matches){
  let lastTrailSpawn = 0;
  const TRAIL_MIN_INTERVAL_MS = 90;
  grid.addEventListener('pointermove', e => {
    if(e.pointerType !== 'mouse') return;
    const now = performance.now();
    if(now - lastTrailSpawn < TRAIL_MIN_INTERVAL_MS) return;
    lastTrailSpawn = now;
    spawnTrailPiece(e.clientX, e.clientY);
  });
}
function spawnTrailPiece(x, y){
  const piece = document.createElement('div');
  piece.className = 'cursor-trail-piece';
  piece.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="100%" height="100%" aria-hidden="true"><circle cx="12" cy="15.5" r="5"/><circle cx="5" cy="8" r="2.3"/><circle cx="10" cy="4.5" r="2.3"/><circle cx="14.5" cy="4.5" r="2.3"/><circle cx="19" cy="8" r="2.3"/></svg>';
  document.body.appendChild(piece);
  const anim = piece.animate([
    { transform:`translate(${x-7}px, ${y-7}px) scale(.55)`, opacity:.5 },
    { transform:`translate(${x-7}px, ${y+12}px) scale(1)`, opacity:0 }
  ], { duration:650, easing:'ease-out', fill:'forwards' });
  anim.onfinish = () => piece.remove();
  setTimeout(()=> piece.remove(), 750); // fallback cleanup, see fireConfetti for the same pattern
}

function buildNewSectionCard(frame){
  const card = document.createElement('button');
  card.className = 'card new-card';
  card.dataset.id = frame.frameNo;
  card.setAttribute('aria-label', `Open ${frame.title} (added this week)`);

  const img = document.createElement('img');
  img.alt = frame.title;
  img.src = frame.previewSrc || makePreviewUrl(frame.src, CARD_PREVIEW_WIDTH);
  prepareCardImage(img);

  const overlay = document.createElement('div');
  overlay.className = 'card-overlay';
  const titleEl = document.createElement('div');
  titleEl.className = 'card-title';
  titleEl.textContent = frame.title;
  overlay.appendChild(titleEl);
  frame._overlayEl = overlay;
  frame._titleEl = titleEl;

  card.append(img, overlay, buildNewBadge());
  // New Wallpapers has its own lightbox pool so the counter/navigation
  // stays within the new arrivals instead of falling back to All Colors.
  card.addEventListener('click', ()=>{
    if(suppressNextCardClick){ suppressNextCardClick = false; return; }
    playCardClickSound();
    triggerCardPounce(card);
    openLightbox(frame.frameNo, 'new');
  });
  wireCardPreview(card, frame);
  // Use the same reveal-on-scroll observer buildCard() uses (adds the
  // 'visible' class the base .card{opacity:0} rule actually watches for).
  // observeCardReveal()/cardRevealObserver only ever add 'is-visible',
  // which no .card CSS rule matches, so cards revealed through it were
  // stuck permanently at opacity:0 - invisible but still fully
  // interactive (hover preview and click both still worked), which is
  // exactly the "there but invisible" bug this replaces.
  revealObserver.observe(card);
  applyRoastToCardElements(frame);
  return card;
}

function renderNewSection(frames){
  if(!newSection || !newGrid) return;
  const newFrames = frames.filter(frame => frame.isNew);

  newGrid.innerHTML = '';
  hasNewFrames = newFrames.length > 0;
  if(!hasNewFrames){
    updateNewSectionVisibility();
    return;
  }

  const frag = document.createDocumentFragment();
  newFrames.forEach(frame => frag.appendChild(buildNewSectionCard(frame)));
  newGrid.appendChild(frag);
  updateNewSectionVisibility();

  // Let the section announce itself as a fresh collection - only worth doing
  // if the section is actually visible right now (a color filter may be
  // active, in which case it's still hidden and the animation would be
  // wasted/invisible).
  if(!newSection.hidden){
    newSection.classList.remove('expressive-arrival');
    void newSection.offsetWidth;
    newSection.classList.add('expressive-arrival');
  }
}

function renderFrames(frames, usingPlaceholders=false, isAuthoritative=true){
  // Invalidate any chunked render that is still scheduled from a previous
  // manifest. Without this, a background GitHub refresh could race the
  // cached render and leave a partially mixed gallery.
  renderGeneration++;
  const generation = renderGeneration;

  // Placeholder/demo art doesn't have real filenames yet at this point
  // (buildCard assigns them per-card), so there's nothing to track.
  if(!usingPlaceholders){
    trackNewWallpapers(frames, isAuthoritative);
    // Newest-confirmed-upload-first, using whatever real commit dates a
    // previous session already learned (see sortFramesByRecency above).
    // Anything without a confirmed date yet keeps its original order.
    frames = sortFramesByRecency(frames);
  }

  grid.innerHTML = '';
  Object.keys(frameData).forEach(key => delete frameData[key]);
  buildCardsChunked(frames, usingPlaceholders, IS_MOBILE_DEVICE ? 6 : 12, generation);

  renderNewSection(usingPlaceholders ? [] : frames);

  // Reset the color filter chips for this manifest, then classify every
  // wallpaper's dominant color in the background (decoupled from lazy card
  // loading above, so filtering stays accurate even before scrolling).
  resetColorFilterUI(frames.length);
  computeAllFrameColors(frames, generation);

  if(frames[0]?.src){
    const ambientSrc = frames[0].previewSrc || makePreviewUrl(frames[0].src, CARD_PREVIEW_WIDTH);
    document.getElementById('ambientBg').style.backgroundImage =
      `url("${ambientSrc}")`;
  }
}


const revealObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('visible');
      revealObserver.unobserve(entry.target);
    }
  });
}, { rootMargin:'120px 0px', threshold:0.05 });

function renderSkeletons(count){
  const frag = document.createDocumentFragment();
  for(let i=0;i<count;i++){
    const sk = document.createElement('div');
    sk.className = 'skeleton';
    frag.appendChild(sk);
  }
  grid.appendChild(frag);
}

function buildCard(frame, idx, usingPlaceholders){
  if(usingPlaceholders){
    const canvas = document.createElement('canvas');
    canvas.width=W; canvas.height=H;
    const ctx = canvas.getContext('2d');
    paintWallpaper(ctx, W, H, frame.family);
    frame.src = canvas.toDataURL('image/png');
    frame.previewSrc = frame.src;
    frame.lightboxSrc = frame.src;
    frame.filename = `${slugify(frame.title)}-${pad(frame.frameNo)}.png`;
  }
  frameData[frame.frameNo] = frame;

  const card = document.createElement('button');
  card.className = 'card';
  card.dataset.id = frame.frameNo;
  card.setAttribute('aria-label', frame.isNew ? `Open ${frame.title} (added this week)` : `Open ${frame.title}`);

  const img = document.createElement('img');
  img.alt = frame.title;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.fetchPriority = idx < (IS_MOBILE_DEVICE ? 2 : 4) ? 'high' : 'low';

  // Attach the listener BEFORE assigning src. This is important because
  // cached images can finish loading immediately.
  frame._img = img;

  img.addEventListener('load', ()=>{
    frame.width = img.naturalWidth;
    frame.height = img.naturalHeight;

  }, { once:true });

  // Use only the resized preview for the gallery. The original `frame.src`
  // is intentionally never assigned to the card image.
  img.src = frame.previewSrc || makePreviewUrl(frame.src, CARD_PREVIEW_WIDTH);

  // This image already has its own native loading='lazy'/fetchPriority
  // strategy above. Mark it as already handled so the grid MutationObserver
  // (which calls prepareCardImage on every newly-added card, for the
  // color-filter/lazy system) doesn't strip the src it just got and re-gate
  // it behind the IntersectionObserver - that would cancel/duplicate the
  // fetch and defeat fetchPriority='high' on the first visible cards.
  img.dataset.lazyPrepared = 'true';

  if(img.complete && img.naturalWidth){
    frame.width = img.naturalWidth;
    frame.height = img.naturalHeight;
    // These helpers existed in an earlier filter version of the gallery.
    // Guard them so an already-cached image can never abort card creation
    // during a browser refresh.
    if(typeof resolutionKey === 'function'){
      frame.resolution = resolutionKey(img.naturalWidth, img.naturalHeight);
    }
    if(typeof rebuildResolutionFilters === 'function'){
      rebuildResolutionFilters();
    }
  }

  const overlay = document.createElement('div');
  overlay.className = 'card-overlay';
  const titleEl = document.createElement('div');
  titleEl.className = 'card-title';
  titleEl.textContent = frame.title;
  overlay.appendChild(titleEl);
  frame._overlayEl = overlay;
  frame._titleEl = titleEl;

  card.append(img, overlay);
  syncNewBadge(card, frame);
  card.addEventListener('click', ()=>{
    if(suppressNextCardClick){ suppressNextCardClick = false; return; }
    playCardClickSound();
    triggerCardPounce(card);
    openLightbox(frame.frameNo);
  });
  wireCardPreview(card, frame);
  grid.appendChild(card);
  frame._card=card;
  // Chunked rendering can continue after a filter is selected, so every new
  // card must be filtered immediately instead of waiting for a second click.
  applyColorFilterToCard(card);
  applyRoastToCardElements(frame);
  revealObserver.observe(card);
}

function buildCardsChunked(frames, usingPlaceholders, chunkSize=12, generation=renderGeneration){
  let i = 0;
  function step(){
    // Stop immediately if another render has replaced this manifest.
    if(generation !== renderGeneration) return;
    const end = Math.min(i + chunkSize, frames.length);
    for(; i < end; i++){
      if(generation !== renderGeneration) return;
      buildCard(frames[i], i, usingPlaceholders);
    }
    if(i < frames.length) requestAnimationFrame(step);
  }
  step();
}

renderSkeletons(12);

async function init(){
  // Render the last known wallpaper list immediately. This makes refreshes
  // reliable even when the GitHub API is temporarily unavailable.
  const cachedFrames = readWallpaperCache();

  if(cachedFrames?.length){
    // Non-authoritative: the cache can be stale or incomplete, so this
    // pass only reads existing "first seen" data, it never decides what's new.
    renderFrames(cachedFrames, false, false);
  }

  // Always try to refresh the manifest in the background so newly added
  // wallpapers still appear without requiring the user to reopen the file.
  try{
    const freshFrames = await fetchWallpapersFromGitHub(GITHUB_SOURCE);
    if(!freshFrames.length) throw new Error('No images found in that repo/path');

    // Never replace a known-good manifest with a transiently incomplete
    // API response. Match wallpapers by filename so ordering/indices cannot
    // make one card disappear between refreshes.
    const known = cachedFrames || [];
    const freshByFile = new Map(freshFrames.map(frame => [frame.filename, frame]));

    // A successful GitHub listing is authoritative.
    // If wallpapers were deleted from the repository, they should disappear
    // from the gallery instead of being restored from the local cache.
    // The cache is still used above for instant startup and remains a fallback
    // only when the GitHub refresh itself fails.
    let finalFrames = freshFrames;

    // Re-number after the authoritative refresh so frame IDs are always
    // unique and stable for the current render.
    finalFrames = finalFrames.map((frame, index) => ({...frame, frameNo:index + 1}));
    writeWallpaperCache(finalFrames);
    // Authoritative: this is the live GitHub listing, so it's the one
    // allowed to stamp genuinely new filenames with today's date.
    renderFrames(finalFrames, false, true);
    // Then confirm/correct those isNew guesses against the repo's actual
    // commit history in the background, so every device ends up agreeing
    // on what's new instead of it depending on local browser memory.
    applyGitHistoryNewFlags(finalFrames);
  }catch(err){
    console.warn('Could not refresh wallpapers from GitHub:', err.message);

    // If there is no cache yet, use the built-in placeholders instead of
    // leaving the gallery empty.
    if(!cachedFrames?.length){
      const fallbackFrames = buildPlaceholderFrames();
      renderFrames(fallbackFrames, true);
    }
  }

  // Keep the custom collection subtitle.
  document.getElementById('subtitle').textContent = 'maomao 😾';
}
init();

/* ---------- Button press ripple ---------- */
function spawnRipple(x, y, el){
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.6;
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = size + 'px';
  span.style.left = (x - rect.left - size / 2) + 'px';
  span.style.top = (y - rect.top - size / 2) + 'px';
  el.appendChild(span);
  span.addEventListener('animationend', () => span.remove());
}
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.icon-btn, .filled-btn, .fab');
  if(!el || el.disabled) return;
  spawnRipple(e.clientX, e.clientY, el);
});

/* ---------- Surprise me ----------
   An arcade prize-wheel flourish: the highlight travels card-by-card
   through the grid in order (like a chase light / slot reel), doing a
   couple of full laps and then decelerating — same way a claw-machine
   or raffle light slows to a stop — before landing exactly on the real
   pick, which then gets the scroll + pulse treatment. */
// Looks up the swatch hex for a card's assigned color-filter bucket, so
// the surprise-me glow/stroke effects always match the same palette the
// color chips use. Falls back to null (CSS then falls back to the
// default primary/olive tone) when a card hasn't been color-classified.
function glowColorForCard(card){
  const frame = frameData[card.dataset.id];
  const bucket = frame && COLOR_BUCKETS.find(b=>b.key===frame.colorKey);
  return bucket ? bucket.swatch : null;
}

function setGlowColor(card, hex){
  if(hex) card.style.setProperty('--glow-color', hex);
  else card.style.removeProperty('--glow-color');
}

document.getElementById('surpriseBtn').addEventListener('click', ()=>{
  const btn = document.getElementById('surpriseBtn');
  if(btn.classList.contains('is-picking')) return; // ignore rapid re-clicks mid-flourish

  const cards = Array.from(grid.querySelectorAll('.card'))
    .filter(card=>!card.classList.contains('filter-hidden') && !card.hidden);
  if(!cards.length) return;

  btn.classList.remove('is-picking');
  void btn.offsetWidth;
  btn.classList.add('is-picking');

  const finalIndex = Math.floor(Math.random()*cards.length);
  const finalPick = cards[finalIndex];
  const finalGlow = glowColorForCard(finalPick);

  const settle = () => {
    finalPick.scrollIntoView({ behavior:'smooth', block:'center' });
    setTimeout(() => {
      finalPick.classList.remove('is-flicker');
      finalPick.classList.add('pulse');
      setTimeout(()=>{
        finalPick.classList.remove('pulse');
        setGlowColor(finalPick, null);
        btn.classList.remove('is-picking');
        openLightbox(finalPick.dataset.id);
      }, 350); // brief pulse, then open — no need to wait out the full 1s ring
    }, 450); // scroll immediately with the stroke still on, so it's visible on the way in; then switch glow -> pulse once it's landed
  };

  if(cards.length === 1){
    setGlowColor(finalPick, finalGlow);
    finalPick.classList.add('is-flicker');
    playSurpriseLandSound();
    settle();
    return;
  }

  // Fixed number of ticks regardless of how many wallpapers are loaded, so
  // the flourish always takes ~2s whether the grid has 8 cards or 200 —
  // it samples positions across a couple of "laps" of the grid via an
  // ease-out curve (fast at first, slowing down) rather than stepping one
  // card at a time, which is what made it crawl on large collections.
  const startIndex = (finalIndex + 1 + Math.floor(Math.random()*(cards.length-1))) % cards.length;
  const laps = cards.length > 3 ? 2 : 1;
  const distance = (finalIndex - startIndex + cards.length) % cards.length;
  const totalDistance = distance + cards.length * laps;
  const ticks = 16;
  const easeOutCubic = t => 1 - Math.pow(1-t, 3);

  let tickNum = 0;
  let prevFlicker = null; // tracked directly instead of querying the DOM each tick

  const tick = () => {
    if(prevFlicker){
      prevFlicker.classList.remove('is-flicker');
      setGlowColor(prevFlicker, null);
    }

    const isFinal = tickNum === ticks;
    const idx = isFinal ? finalIndex
      : (startIndex + Math.round(easeOutCubic(tickNum/ticks) * totalDistance)) % cards.length;
    const card = cards[idx];

    setGlowColor(card, isFinal ? finalGlow : glowColorForCard(card));
    card.classList.add('is-flicker');
    prevFlicker = card;

    if(isFinal){
      playSurpriseLandSound();
      settle(); // scroll to it right away so the stroke is visible on the way into view
    } else {
      playSurpriseTickSound();
      tickNum++;
      // Ease-out timing too: quick ticks at the start, stretching out
      // toward the end, like a wheel losing momentum and settling.
      const t = tickNum / ticks;
      setTimeout(tick, 55 + Math.pow(t, 3) * 260);
    }
  };
  tick();
});

/* ---------- Lightbox ---------- */
const lightbox = document.getElementById('lightbox');
const lbStatus = document.getElementById('lbStatus');
const lbStatusText = document.getElementById('lbStatusText');
const lbSpinner = document.querySelector('#lbStatus .lb-spinner');
const lbTitle = document.getElementById('lbTitle');
const lbCount = document.getElementById('lbCount');
const lbDownload = document.getElementById('lbDownload');
const wpCarousel = document.getElementById('wpCarousel');
const wpTrack = document.getElementById('wpTrack');
let currentIndex = -1;
let lightboxPoolMode = 'main';

function getPool(mode = 'main'){
  if(mode === 'new'){
    // New Wallpapers is a separate collection. Its lightbox should only
    // contain the wallpapers currently shown in the New Wallpapers section.
    return Array.from(newGrid?.querySelectorAll('.new-card') || [])
      .filter(card => !card.hidden);
  }

  // The main lightbox follows the currently visible/filtered gallery,
  // not the full wallpaper manifest. Color filtering marks excluded
  // cards with .filter-hidden instead of removing them from the DOM.
  return Array.from(grid.querySelectorAll('.card'))
    .filter(card => !card.classList.contains('filter-hidden') && !card.hidden);
}

function openLightbox(id, mode = 'main'){
  const pool = getPool(mode);
  if(!pool.length) return;
  const found = pool.findIndex(el=>el.dataset.id === String(id));
  currentIndex = found===-1 ? 0 : found;
  lightboxPoolMode = mode;
  lightbox.hidden = false;
  document.body.style.overflow = 'hidden';
  wpPoolIds = null; // force a fresh carousel build for the new pool
  wpLastPunchedIndex = -1;
  // null (not 1 or -1) marks "no move made yet this session" — so whichever
  // way the person first steps from the opening tile is treated like a
  // reversal too, giving that origin tile its one-frame echo peek instead
  // of vanishing outright. See the reversed checks in goToIndex/stepLightbox.
  wpDirection = null;
  renderLightbox(pool, true); // skip the debounce on the very first open — only rapid Next/Prev needs it
}

/* ---------- Hero carousel (Material 3 "carousel" style) ----------
   Every wallpaper in the pool gets one tile in the track. The active tile
   is uncropped (object-fit:contain) and takes the largest share of the
   available width so the selected wallpaper stays fully visible; each tile
   further away shrinks to a proportionally smaller cropped "peek" card. The
   track is re-centered on the active tile and clamped so it can never show
   empty space past the first or last wallpaper — which is what produces the
   "flush against the edge" look at the very start and very end of the
   list, mirrored on either side. */
const WP_GAP = 10;
// Matches the .wp-item width transition's duration in CSS (.38s). The image
// swap below is timed off this so it lands after the resize has visually
// settled, instead of overlapping it — see the comment at runHeavyWork.
const WP_RESIZE_MS = 380;
let wpPoolIds = null;
let wpDragging = false;
let wpLastPunchedIndex = -1;
let wpDragMoved = false;
let wpDragStartX = 0;
let wpDragBase = 0;
// Rubber-band bounds for the drag in progress, cached at pointerdown (see
// below) instead of being recomputed — item widths plus a clientWidth
// layout read — on every single pointermove of the drag.
let wpDragMinT = 0;
// Which way the person is currently browsing: 1 = toward the end of the
// list (their most recent move was Next, or a forward swipe/tap), -1 =
// toward the beginning (Previous). null = no move made yet since opening
// (treated like a reversal on whichever way the first move goes — see the
// reversed checks below). The big 30% "runner-up" tile and the cascade of
// 10% pills always sit on the side the person is heading toward — so this
// flips which side gets which treatment.
let wpDirection = null;
// When the person reverses direction (their previous move was Next and this
// one is Previous, or vice versa), the tile they're leaving behind would
// otherwise instantly collapse to width 0 while a whole cascade pops in on
// the opposite side — a jarring double-pop. wpEchoIndex softens that one
// step: it names the tile just left, which gets a small 10% "echo" pill on
// the trailing edge instead of vanishing outright. It's set for exactly one
// render (the reversal step itself) and cleared right after, so continuing
// in the same new direction goes straight back to the plain 60/30/10 cascade.
let wpEchoIndex = null;
// On phones/touch devices, navigation should only happen via the explicit
// Previous/Next buttons — no swiping the strip and no tapping the image to
// jump to another wallpaper. Desktop pointer (mouse) drag-to-browse is kept.
const wpIsTouchNav = window.matchMedia('(pointer:coarse)').matches;

// Below this width, the carousel shows only its active tile (see the
// max-width:760px ".wp-item{display:none}" rule) instead of the peek
// cascade — a plain single-photo viewer instead of a browsing strip.
// layoutCarousel checks this to skip the now-inapplicable peek-width/
// translate math (see the "mobile single view" branch there), and the code
// below uses it to reshuffle the bottom bar into two rows: title+Download
// on top, Prev/counter/Next below. #lbCount and #lbDownload each move to a
// different parent than they have on desktop (#lbCount out of .dialog-top,
// #lbDownload out of .dialog-actions) purely for that "which row is it in"
// reason, not because their own behavior changes — simplest to physically
// move the two elements for that rather than keep duplicates in sync.
const wpMobileSingleView = window.matchMedia('(max-width:760px)');
const lbCountDesktopHome = lbCount.parentNode;
const lbDownloadDesktopHome = lbDownload.parentNode;
const lbDownloadDesktopNextSibling = lbDownload.nextSibling;
const dialogBottomEl = document.querySelector('.dialog-bottom');
const dialogActionsEl = document.querySelector('.dialog-actions');
const lbNextBtn = document.getElementById('lbNext');
function relocateLbCountForViewport(){
  if(wpMobileSingleView.matches){
    // Row 2: Prev / counter / Next, in that order, as the only three
    // children of .dialog-actions — its flex justify-content:space-between
    // then centers the counter between the two equal-width buttons (see
    // the CSS comment on .dialog-bottom for why this needs to be its own
    // flex row rather than sharing row 1's grid columns).
    if(lbCount.parentNode !== dialogActionsEl) dialogActionsEl.insertBefore(lbCount, lbNextBtn);
    // Row 1: title + Download, as direct children of .dialog-bottom itself
    // (not nested inside .dialog-actions), so Download can take the
    // "download" grid-area next to the title instead of landing in row 2.
    if(lbDownload.parentNode !== dialogBottomEl) dialogBottomEl.appendChild(lbDownload);
  }else{
    if(lbCount.parentNode !== lbCountDesktopHome){
      // Put it back before the maximize/close button group, its original spot.
      lbCountDesktopHome.insertBefore(lbCount, lbCountDesktopHome.firstChild);
    }
    if(lbDownload.parentNode !== lbDownloadDesktopHome){
      lbDownloadDesktopHome.insertBefore(lbDownload, lbDownloadDesktopNextSibling);
    }
  }
}
relocateLbCountForViewport();
wpMobileSingleView.addEventListener('change', relocateLbCountForViewport);

// Each tile's width is a percentage of the carousel's own width. The active
// tile is always 60%. The side the person is currently heading toward (see
// wpDirection) gets a 30% "on deck" tile right next to it, then every tile
// after that shrinks to a constant 10% pill, cascading all the way to
// whichever end of the list is in that direction. The side they came from
// gets nothing — it's fully offscreen — so the strip always reads as one
// big tile plus a run of shrinking ones flowing the way they're browsing.
// Pools of exactly two wallpapers only ever show two tiles: 70% active /
// 30% the other one, since there's no room for a pill cascade.
function wpItemFraction(i, activeIndex, poolLen, echoIndex){
  if(poolLen <= 1) return 1;
  if(poolLen === 2) return i === activeIndex ? 0.70 : 0.30;

  if(i === activeIndex) return 0.60;

  // Which physical side (left/right) is "ahead" depends on wpDirection.
  // dir === 1 (heading toward the end of the list): ahead = higher indices.
  // dir === -1 (heading toward the beginning): ahead = lower indices.
  // If that side has no tiles left (the active tile is sitting flush at
  // that end of the list already), fall back to the other side instead of
  // collapsing down to a single lonely tile.
  let dir = wpDirection === -1 ? -1 : 1;
  const aheadExists = dir === 1 ? activeIndex < poolLen - 1 : activeIndex > 0;
  if(!aheadExists) dir = -dir;

  const stepsAhead = (i - activeIndex) * dir;

  if(stepsAhead <= 0){
    if(stepsAhead === -1){
      // Resting one step before either true boundary of the list — the 2nd
      // wallpaper while heading backward, or the 2nd-to-last wallpaper while
      // heading forward — the tile you just passed keeps its trailing peek
      // permanently, not just for one frame. That's the one stop on each
      // end where the "ahead" side (just the 1st/last wallpaper) can't grow
      // any further and the true boundary is one step away — so the strip
      // stays populated on both sides here instead of going flat black.
      // Every other stop, in either direction, doesn't get this treatment.
      if((dir === -1 && activeIndex === 1) || (dir === 1 && activeIndex === poolLen - 2)) return 0.10;
      // Otherwise, that trailing tile only lingers for one transitional
      // frame — right after a direction reversal (or the very first move
      // after opening the lightbox, which counts as a reversal too — see
      // wpDirection's initial null in goToIndex/stepLightbox) — then fully
      // collapses on the next same-direction step.
      if(echoIndex !== null && i === echoIndex) return 0.10;
    }
    return null; // behind the direction of travel: hidden
  }
  if(stepsAhead === 1) return 0.30;
  return 0.10; // every further tile in that direction: a constant pill
}

function wpItemWidth(i, activeIndex, poolLen, containerW, echoIndex){
  const frac = wpItemFraction(i, activeIndex, poolLen, echoIndex);
  return frac === null ? 0 : Math.round(containerW * frac);
}

function goToIndex(i){
  const pool = getPool(lightboxPoolMode);
  if(i < 0 || i >= pool.length || i === currentIndex) return;
  const newDir = i > currentIndex ? 1 : -1;
  const reversed = wpDirection === null || newDir !== wpDirection;
  wpEchoIndex = reversed ? currentIndex : null;
  wpDirection = newDir;
  currentIndex = i;
  renderLightbox(pool);
  maybeShowChromeOnNavigate();
}

function buildCarousel(pool){
  const ids = pool.map(el => el.dataset.id);
  const sameSet = wpPoolIds && wpPoolIds.length === ids.length && wpPoolIds.every((id,i)=>id===ids[i]);
  if(sameSet) return Array.from(wpTrack.children);

  wpTrack.innerHTML = '';
  ids.forEach((id,i) => {
    const frame = frameData[id];
    const item = document.createElement('div');
    item.className = 'wp-item';
    item.dataset.index = i;
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.draggable = false;
    img.alt = frame?.title || '';
    img.src = frame?.previewSrc || makePreviewUrl(frame.src, CARD_PREVIEW_WIDTH);
    item.appendChild(img);
    item.addEventListener('click', () => {
      if(wpIsTouchNav) return; // phones: buttons only, no tap-to-jump
      if(wpDragMoved) return;
      goToIndex(i);
    });
    wpTrack.appendChild(item);
  });
  wpPoolIds = ids;
  return Array.from(wpTrack.children);
}

function layoutCarousel(){
  const items = Array.from(wpTrack.children);
  if(!items.length || !wpCarousel) return;
  const containerW = wpCarousel.clientWidth;
  let x = 0;
  const lefts = [];
  items.forEach((item,i) => {
    const w = wpItemWidth(i, currentIndex, items.length, containerW, wpEchoIndex);
    const hidden = w === 0;
    item.style.width = w + 'px';
    item.classList.toggle('is-active', i === currentIndex);
    item.classList.toggle('is-hidden', hidden);
    lefts.push({left:x, width:w});
    x += w + (hidden ? 0 : WP_GAP);
  });
  const trackWidth = x - WP_GAP;
  const active = lefts[currentIndex];
  if(!active) return;
  const activeCenter = active.left + active.width / 2;
  const minTranslate = Math.min(0, containerW - trackWidth);
  let translate = containerW / 2 - activeCenter;
  translate = Math.max(minTranslate, Math.min(0, translate));
  // Below 760px, only the active tile is ever actually visible (CSS hides
  // the rest — see the mobile "single wallpaper, no carousel peeks" rule) —
  // so the peek-width math above, sized for a multi-tile strip, no longer
  // describes what's on screen. The one visible tile already fills the
  // container on its own; translate just needs to stay put at 0 rather
  // than shift for peek tiles that aren't actually being drawn.
  if(wpMobileSingleView.matches) translate = 0;
  wpDragBase = translate;
  if(!wpTrack.classList.contains('is-dragging')){
    wpTrack.style.transform = `translateX(${translate}px)`;
  }
  // Re-measure which index is active so future layout passes have an
  // accurate baseline — no per-tile pop/slide animation is added here
  // anymore; the track's own transform transition is the only motion.
  wpLastPunchedIndex = currentIndex;
  // The nudge below only means something for the desktop peek-carousel,
  // where activeCenter (from the 60/30/10% peek-fraction math above) can
  // sit off the container's true center. In mobile single-view there are
  // no peek tiles - the active tile already fills and is centered in the
  // container on its own - so activeCenter is meaningless here and was
  // pushing the spinner off-center in the phone/fullscreen popup for no
  // reason. Always center it there instead of applying the leftover
  // desktop offset.
  positionLbSpinner(wpMobileSingleView.matches ? 0 : translate + activeCenter - containerW / 2);
}

// The loading spinner is centered across the whole .dialog-media box by
// default (see .dialog-status), which is the same as the active wallpaper
// only when the carousel's translate above isn't clamped. At the very first
// or last wallpaper it *is* clamped — the active tile sits flush against an
// edge instead of in the middle — so the spinner would visibly sit over the
// gap/peek tiles rather than the photo that's actually loading. Nudging the
// spinner by the same clamp amount keeps it centered on the wallpaper itself
// instead of the popup around it.
function positionLbSpinner(offsetX){
  if(!lbSpinner) return;
  lbSpinner.style.transform = offsetX ? `translateX(${offsetX}px)` : '';
}

function setActiveImage(item, frame){
  const img = item.querySelector('img');
  const hi = frame.lightboxSrc || makePreviewUrl(frame.src, LIGHTBOX_PREVIEW_WIDTH);
  lbStatus.hidden = false;
  lbStatus.classList.remove('error');
  lbStatusText.textContent = 'Loading…';
  img.onload = () => {
    lbStatus.hidden = true;
  };
  img.onerror = () => {
    lbStatus.classList.add('error');
    lbStatusText.textContent = "Couldn't load this image — try Download instead, or open it directly on GitHub.";
  };
  if(img.src !== hi){
    img.src = hi;
  } else if(img.complete){
    lbStatus.hidden = true;
  }
}

if(wpCarousel){
  wpCarousel.addEventListener('pointerdown', e => {
    if(wpIsTouchNav) return; // phones: buttons only, no swipe-drag
    if(wpMobileSingleView.matches) return; // no peek tiles to drag between at this width
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    wpDragging = true;
    wpDragMoved = false;
    wpDragStartX = e.clientX;
    wpTrack.classList.add('is-dragging');
    wpCarousel.classList.add('is-dragging');
    wpCarousel.setPointerCapture(e.pointerId);

    // Compute the rubber-band bound once per drag rather than on every
    // pointermove: currentIndex/wpEchoIndex (the only inputs to item width)
    // don't change mid-drag, so re-walking every tile and re-reading
    // clientWidth on each move was repeated work for the same answer.
    const items = Array.from(wpTrack.children);
    const containerW = wpCarousel.clientWidth;
    let x = 0;
    items.forEach((item,i) => {
      const w = wpItemWidth(i, currentIndex, items.length, containerW, wpEchoIndex);
      x += w + (w === 0 ? 0 : WP_GAP);
    });
    const trackWidth = x - WP_GAP;
    wpDragMinT = Math.min(0, containerW - trackWidth);
  });
  wpCarousel.addEventListener('pointermove', e => {
    if(!wpDragging) return;
    const dx = e.clientX - wpDragStartX;
    if(Math.abs(dx) > 4) wpDragMoved = true;
    let next = wpDragBase + dx;
    // Rubber-band resistance once dragging past either end of the strip —
    // the bounce-back on release is what sells the Pixel-carousel feel.
    const minT = wpDragMinT;
    const maxT = 0;
    if(next > maxT) next = maxT + (next - maxT) * 0.35;
    if(next < minT) next = minT + (next - minT) * 0.35;
    wpTrack.style.transform = `translateX(${next}px)`;
  });
  const endDrag = e => {
    if(!wpDragging) return;
    wpDragging = false;
    wpTrack.classList.remove('is-dragging');
    wpCarousel.classList.remove('is-dragging');
    const dx = (e.clientX ?? wpDragStartX) - wpDragStartX;
    if(Math.abs(dx) > 60){
      goToIndex(currentIndex + (dx < 0 ? 1 : -1));
    } else {
      layoutCarousel(); // spring back to the current tile
    }
    setTimeout(() => { wpDragMoved = false; }, 30);
  };
  wpCarousel.addEventListener('pointerup', endDrag);
  wpCarousel.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', () => { if(!lightbox.hidden) layoutCarousel(); });
}

// Tracks the most recent renderLightbox() call so that when Next/Prev is
// clicked rapidly, the expensive parts (decoding a full-size image,
// preloading neighbors) only actually run for wherever the user finally
// lands — not for every intermediate frame they blew past on the way
// there. The cheap parts (title, counter, carousel position) still update
// on every single click so navigation still feels instant either way.
let lightboxRenderGen = 0;

function renderLightbox(pool, immediate=false){
  const items = buildCarousel(pool);
  const el = pool[currentIndex];
  const frame = frameData[el.dataset.id];
  const gen = ++lightboxRenderGen;

  setLightboxTitle(frame);

  // Restart the count-pop animation without forcing a synchronous layout
  // flush (the old `void lbCount.offsetWidth` trick reflows immediately,
  // right on the click handler's stack — costly if it's firing on every
  // click of a fast double-click). A double rAF restarts the animation on
  // the browser's own paint schedule instead.
  lbCount.classList.remove('expressive-count');
  lbCount.textContent = `${currentIndex+1} / ${pool.length}`;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      if(gen === lightboxRenderGen) lbCount.classList.add('expressive-count');
    });
  });

  layoutCarousel();

  // Debounce the heavy work: full-size image decode + neighbor preloads.
  // If another step comes in before this fires, this one is dropped —
  // so spamming Next/Prev doesn't pile up concurrent large-image decodes
  // for frames already scrolled past. Skipped on the very first open so
  // that case still starts loading immediately.
  //
  // Timed to land after the tile's width transition finishes (WP_RESIZE_MS),
  // not partway through it. Swapping to the full-res image mid-resize meant
  // the browser was decoding/repainting a large image at a constantly
  // changing box size on top of the resize's own reflow cost, every frame —
  // that stacked cost was the other big source of jank alongside the width
  // transition itself. The tile now just shows its small preview (already
  // loaded, cheap to rescale) until it's done moving, then upgrades to sharp.
  const runHeavyWork = () => {
    if(gen !== lightboxRenderGen) return;

    const ambient = document.getElementById('ambientBg');
    if(ambient){
      const ambientSrc = frame.previewSrc || makePreviewUrl(frame.src, CARD_PREVIEW_WIDTH);
      ambient.style.backgroundImage = `url("${ambientSrc}")`;
    }

    setActiveImage(items[currentIndex], frame);

    // Preload neighbors' full-size previews so stepping the carousel feels instant.
    [currentIndex - 1, currentIndex + 1].forEach(i => {
      if(i < 0 || i >= pool.length) return;
      const nextFrame = frameData[pool[i].dataset.id];
      if(nextFrame){
        const preload = new Image();
        preload.decoding = 'async';
        preload.src = nextFrame.lightboxSrc || makePreviewUrl(nextFrame.src, LIGHTBOX_PREVIEW_WIDTH);
      }
    });
  };
  if(immediate) runHeavyWork();
  else setTimeout(runHeavyWork, WP_RESIZE_MS + 40);

let chromeHideTimer = null;

function maybeShowChromeOnNavigate(){

const dialogMediaEl = document.querySelector('.dialog-media');
// Cached once: this element never changes, so re-running querySelector('.dialog')
// repeatedly (including on every pointermove of a drag) was wasted DOM
// lookup work on handlers that already fire many times per second.
const dialogEl = document.querySelector('.dialog');
let swipeStartX = 0, swipeStartY = 0, swipeDragging = false, swipeMoved = false;
if(dialogMediaEl){
  dialogMediaEl.addEventListener('pointerdown', e => {
    if(!wpIsTouchNav || !dialogEl.classList.contains('is-maximized')) return;
    swipeDragging = true;
    swipeMoved = false;
    swipeStartX = e.clientX;
    swipeStartY = e.clientY;
  });
  dialogMediaEl.addEventListener('pointermove', e => {
    if(!swipeDragging) return;
    const dx = e.clientX - swipeStartX;
    const dy = e.clientY - swipeStartY;
    if(Math.abs(dy) > 6 || Math.abs(dx) > 6) swipeMoved = true;
    // Only a mostly-vertical, downward drag counts as swipe-to-close — a
    // mostly-horizontal one is the carousel's own swipe-to-navigate area.
    if(dy > 0 && Math.abs(dy) > Math.abs(dx)){
      dialogEl.classList.add('chrome-hidden');
      dialogEl.style.transform = `translateY(${dy}px)`;
      dialogEl.style.opacity = String(Math.max(.4, 1 - dy / 600));
    }
  });
  const endSwipe = e => {
    if(!swipeDragging) return;
    swipeDragging = false;
    const dialog = dialogEl;
    const dy = (e.clientY ?? swipeStartY) - swipeStartY;
    const dx = (e.clientX ?? swipeStartX) - swipeStartX;
    dialog.style.transform = '';
    dialog.style.opacity = '';
    if(dy > 110 && Math.abs(dy) > Math.abs(dx)){
      closeLightbox();
    } else if(!swipeMoved){
      // A tap rather than a drag: toggle the overlay bars.
      if(dialog.classList.contains('chrome-hidden')) showChrome();
      else { dialog.classList.add('chrome-hidden'); clearTimeout(chromeHideTimer); }
    } else if(!dialog.classList.contains('chrome-hidden')){
      scheduleChromeHide();
    }
    setTimeout(() => { swipeMoved = false; }, 30);
  };
  dialogMediaEl.addEventListener('pointerup', endSwipe);
  dialogMediaEl.addEventListener('pointercancel', endSwipe);
}

function stepLightbox(delta){
  const pool = getPool(lightboxPoolMode);
  if(!pool.length) return;
  // Clamped, not wrapping: the carousel has a real first/last tile, and the
  // edge-flush layout only reads correctly if navigation actually stops there.
  const next = Math.max(0, Math.min(pool.length - 1, currentIndex + delta));
  if(next === currentIndex) return;
  const newDir = delta > 0 ? 1 : -1;
  const reversed = wpDirection === null || newDir !== wpDirection;
  wpEchoIndex = reversed ? currentIndex : null;
  wpDirection = newDir;
  currentIndex = next;
  renderLightbox(pool);
  maybeShowChromeOnNavigate();
}

/* ---------- Download ---------- */

const wallpaperBlobCache = new Map();

async function downloadFrame(frame){
  let waitingMessage, waitingInterval;
  try{
    showExpressiveSnackbar(
      'Preparing download...',
      'Large wallpapers may take a few seconds. Please wait.'
    );

    waitingMessage = setTimeout(() => {
      showExpressiveSnackbar(
        'Still working...',
        'Large wallpaper files can take a little longer. Please wait.'
      );
    }, 2500);

    waitingInterval = setInterval(() => {
      showExpressiveSnackbar(
        'Still downloading...',
        'Please keep this page open until the download starts.'
      );
    }, 4000);

    let blob = wallpaperBlobCache.get(frame.src);

    if(!blob){
      const response = await fetch(frame.src, {
        cache:'force-cache'
      });
      blob = await response.blob();
      wallpaperBlobCache.set(frame.src, blob);
    }
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = frame.filename || 'wallpaper';

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 10000);

    clearTimeout(waitingMessage);
    clearInterval(waitingInterval);

    showExpressiveSnackbar('Downloaded!', frame.filename);
    showDownloadSuccess();
    playDownloadSound();
  }catch(err){
    clearTimeout(waitingMessage);
    clearInterval(waitingInterval);
    showExpressiveSnackbar('Download failed', frame.filename);
  }
}

let downloadSuccessTimer = null;
function showDownloadSuccess(){
  const label = lbDownload.querySelector('.lb-download-label');
  const previousLabel = label.textContent;
  clearTimeout(downloadSuccessTimer);
  lbDownload.classList.remove('is-success');
  void lbDownload.offsetWidth; // restart the pop animation if triggered twice in a row
  lbDownload.classList.add('is-success');
  label.textContent = 'Downloaded!';
  downloadSuccessTimer = setTimeout(() => {
    lbDownload.classList.remove('is-success');
    label.textContent = previousLabel === 'Downloaded!' ? 'Download' : previousLabel;
  }, 1800);
  fireConfetti(lbDownload);
}

/* ---------- Confetti burst ----------
   Launched from the Download button on a successful save. Colors are pulled
   from the current color-filter theme (plus a couple of fixed accents) so
   the burst always matches whatever palette is active, the same way the
   surprise-me glow does. Each piece is animated independently via the Web
   Animations API rather than appended to a shared timeline, so overlapping
   bursts (rapid repeat downloads) never fight each other, and every piece
   cleans itself up on its own 'finish' event instead of relying on a
   shared timer. Respects prefers-reduced-motion via the CSS rule above,
   which hides .confetti-piece outright — the JS still runs but produces
   no visible motion, so no extra branching is needed here. */
const CONFETTI_COLORS = ['#e0483e','#e08a3e','#e0c93e','#6cbf5c','#4c7fe0','#8a5ce0'];
function confettiPalette(){
  const root = getComputedStyle(document.documentElement);
  const themed = [
    root.getPropertyValue('--md-primary').trim(),
    root.getPropertyValue('--md-secondary').trim(),
    root.getPropertyValue('--md-tertiary').trim(),
  ].filter(Boolean);
  return themed.length ? themed.concat(CONFETTI_COLORS) : CONFETTI_COLORS;
}
function fireConfetti(originEl, count=26){
  if(!originEl || !('animate' in Element.prototype)) return;
  const rect = originEl.getBoundingClientRect();
  const originX = rect.left + rect.width / 2;
  const originY = rect.top + rect.height / 2;
  const palette = confettiPalette();
  const frag = document.createDocumentFragment();
  const pieces = [];
  for(let i=0; i<count; i++){
    const piece = document.createElement('span');
    piece.className = 'confetti-piece' + (Math.random() < 0.5 ? ' is-round' : '');
    piece.style.background = palette[Math.floor(Math.random()*palette.length)];
    const w = 5 + Math.random()*5;
    piece.style.width = `${w}px`;
    piece.style.height = `${(4 + Math.random()*5)}px`;
    frag.appendChild(piece);
    pieces.push(piece);
  }
  document.body.appendChild(frag);
  pieces.forEach(piece=>{
    // Launch mostly upward/outward in a wide arc above the button, then
    // fall and fade — a small burst rather than a full-screen shower.
    const angle = (Math.random()*Math.PI) + Math.PI; // upper half circle
    const distance = 60 + Math.random()*90;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance;
    const fallDistance = 70 + Math.random()*60;
    const spin = (Math.random() < 0.5 ? -1 : 1) * (180 + Math.random()*360);
    const duration = 700 + Math.random()*450;

    const anim = piece.animate([
      { transform:`translate(${originX}px, ${originY}px) rotate(0deg)`, opacity:1 },
      { transform:`translate(${originX+dx}px, ${originY+dy}px) rotate(${spin*0.4}deg)`, opacity:1, offset:0.45 },
      { transform:`translate(${originX+dx*1.15}px, ${originY+dy+fallDistance}px) rotate(${spin}deg)`, opacity:0 }
    ], {
      duration,
      easing:'cubic-bezier(.2,.7,.3,1)',
      fill:'forwards'
    });
    anim.onfinish = () => piece.remove();
    // Belt-and-suspenders cleanup in case 'finish' never fires (e.g. the
    // tab was backgrounded mid-animation).
    setTimeout(() => piece.remove(), duration + 200);
  });
}

/* ---------- Responsive header behavior ---------- */
const topbar = document.querySelector('.topbar');
const headerPlaceholder = document.getElementById('headerPlaceholder');
const mobileTopBtn = document.getElementById('mobileTopBtn');
const colorFilter = document.getElementById('colorFilter');
const colorFilterHome = colorFilter.parentNode;
// Its original next sibling (the New Wallpapers section) - captured once,
// up front, so moveFilterBack() can restore the filter chips to exactly
// where they started. This used to hardcode "insert right before #grid"
// instead, which skipped past the New Wallpapers section - harmless while
// that section is empty/hidden, but the moment it has real content, a
// single scroll-down-then-up cycle would silently leave the filter chips
// stranded below it instead of back at the top, reading as "the filters
// are just gone" since nobody's looking for them down there.
const colorFilterAnchor = colorFilter.nextSibling;
const mobileLayout = window.matchMedia('(max-width: 640px)');
let lastScrollY = window.scrollY;
let headerTicking = false;

function moveFilterIntoHeader(){
  if(colorFilter.parentNode !== topbar) topbar.appendChild(colorFilter);
}
function moveFilterBack(){
  if(colorFilter.parentNode !== colorFilterHome){
    colorFilterHome.insertBefore(colorFilter, colorFilterAnchor);
  }
}

function updateHeaderOnScroll(){
  const y = window.scrollY;
  const delta = y - lastScrollY;
  const isMobile = mobileLayout.matches;

  if(isMobile){
    // Exact mobile behavior from blapples-wallpaper-collection-scroll-header(1).
    moveFilterBack();
    topbar.classList.remove('is-compact');
    if(y > 180 && delta > 0){
      topbar.classList.add('is-mobile-hidden');
      mobileTopBtn.classList.add('visible');
    }else if(delta < 0 && y < 80){
      topbar.classList.remove('is-mobile-hidden');
      mobileTopBtn.classList.remove('visible');
    }else if(delta < 0){
      mobileTopBtn.classList.add('visible');
    }
  }else{
    // Exact desktop compact-header behavior from the reference file.
    const compactThreshold = 90;
    if(y > compactThreshold){
      if(!topbar.classList.contains('is-compact')){
        const rect = topbar.getBoundingClientRect();
        headerPlaceholder.style.height = `${rect.height + 46}px`;
        headerPlaceholder.style.display = 'block';
      }
      moveFilterIntoHeader();
      topbar.classList.add('is-compact');
    }else{
      topbar.classList.remove('is-compact');
      moveFilterBack();
      headerPlaceholder.style.display = 'none';
      headerPlaceholder.style.height = '0px';
    }
  }

  lastScrollY = y;
  headerTicking = false;
}

window.addEventListener('scroll', ()=>{
  if(!headerTicking){
    headerTicking = true;
    requestAnimationFrame(updateHeaderOnScroll);
  }
},{passive:true});

window.addEventListener('resize', ()=>{
  // Re-evaluate the complete header/filter layout after a resize so switching
  // between desktop, tablet and mobile breakpoints never leaves the filter
  // in the wrong container. Coalesced onto the same rAF-guarded flag as the
  // scroll handler above, since a window drag-resize can fire this event
  // many times per frame and the work here includes a getBoundingClientRect
  // read plus DOM moves.
  if(!headerTicking){
    headerTicking = true;
    requestAnimationFrame(updateHeaderOnScroll);
  }
},{passive:true});

const getRandomShape = (current = '') => {
  let shape = officialShapes[Math.floor(Math.random() * officialShapes.length)];
  // Avoid immediately morphing back into exactly the same silhouette.
  let guard = 0;
  while(shape === current && guard++ < 8){
    shape = officialShapes[Math.floor(Math.random() * officialShapes.length)];
  }
  return shape;
};

/* Material-style shape morph engine.
   Instead of converting silhouettes to a fixed list of straight-line points,
   keep the outlines as cubic Bezier segments. Each outline is measured by
   arc-length, normalized to the same perimeter, then cyclically aligned so
   corresponding features stay together during the morph. This is the browser
   equivalent of the RoundedPolygon -> Morph -> asCubics pipeline. */
const MORPH_CUBICS = 96;
const shapeCache = new Map();

const tokenizePath = d => d.match(/[a-zA-Z]|[-+]?(?:\d*\.\d+|\d+\.?)(?:[eE][-+]?\d+)?/g) || [];
const isCmd = t => /^[a-zA-Z]$/.test(t);

const parsePathToCubics = d => {
  const tok=tokenizePath(d); let i=0, cmd='';
  let x=0,y=0,sx=0,sy=0, lastC=null,lastQ=null;
  const out=[];
  const num=()=>parseFloat(tok[i++]);
  const add=(x0,y0,x1,y1,x2,y2,x3,y3)=>out.push({x0,y0,x1,y1,x2,y2,x3,y3});
  const line=(nx,ny)=>add(x,y,x+(nx-x)/3,y+(ny-y)/3,x+2*(nx-x)/3,y+2*(ny-y)/3,nx,ny);
  const quad=(cx,cy,nx,ny)=>{
    const c1x=x+2*(cx-x)/3,c1y=y+2*(cy-y)/3;
    const c2x=nx+2*(cx-nx)/3,c2y=ny+2*(cy-ny)/3;
    add(x,y,c1x,c1y,c2x,c2y,nx,ny);
  };
  while(i<tok.length){
    if(isCmd(tok[i])) cmd=tok[i++];
    const rel=cmd===cmd.toLowerCase(), C=cmd.toUpperCase();
    if(C==='Z') { if(x!==sx||y!==sy) line(sx,sy); x=sx;y=sy;lastC=lastQ=null;cmd='';continue; }
    try{
      if(C==='M'){ const nx=num()+(rel?x:0),ny=num()+(rel?y:0); x=nx;y=ny;sx=x;sy=y;lastC=lastQ=null;cmd=rel?'l':'L'; }
      else if(C==='L'){ const nx=num()+(rel?x:0),ny=num()+(rel?y:0); line(nx,ny);x=nx;y=ny;lastC=lastQ=null; }
      else if(C==='H'){ const nx=num()+(rel?x:0);line(nx,y);x=nx;lastC=lastQ=null; }
      else if(C==='V'){ const ny=num()+(rel?y:0);line(x,ny);y=ny;lastC=lastQ=null; }
      else if(C==='C'){ const c1x=num()+(rel?x:0),c1y=num()+(rel?y:0),c2x=num()+(rel?x:0),c2y=num()+(rel?y:0),nx=num()+(rel?x:0),ny=num()+(rel?y:0);add(x,y,c1x,c1y,c2x,c2y,nx,ny);x=nx;y=ny;lastC={x:c2x,y:c2y};lastQ=null; }
      else if(C==='S'){ const c1=lastC?{x:2*x-lastC.x,y:2*y-lastC.y}:{x,y};const c2x=num()+(rel?x:0),c2y=num()+(rel?y:0),nx=num()+(rel?x:0),ny=num()+(rel?y:0);add(x,y,c1.x,c1.y,c2x,c2y,nx,ny);x=nx;y=ny;lastC={x:c2x,y:c2y};lastQ=null; }
      else if(C==='Q'){ const cx=num()+(rel?x:0),cy=num()+(rel?y:0),nx=num()+(rel?x:0),ny=num()+(rel?y:0);quad(cx,cy,nx,ny);x=nx;y=ny;lastQ={x:cx,y:cy};lastC=null; }
      else if(C==='T'){ const q=lastQ?{x:2*x-lastQ.x,y:2*y-lastQ.y}:{x,y};const nx=num()+(rel?x:0),ny=num()+(rel?y:0);quad(q.x,q.y,nx,ny);x=nx;y=ny;lastQ=q;lastC=null; }
      else if(C==='A'){
        /* Arc commands are converted to cubic approximations through SVG's
           own geometry by sampling the resulting outline below. */
        const rx=num(),ry=num(),rot=num(),large=num(),sweep=num(),nx=num()+(rel?x:0),ny=num()+(rel?y:0);
        // Fallback to a line here; supplied Material silhouettes are cubic.
        line(nx,ny);x=nx;y=ny;lastC=lastQ=null;
      } else break;
    }catch(e){break;}
  }
  return out;
};

const cubicPoint=(c,t)=>{const u=1-t;return [u*u*u*c.x0+3*u*u*t*c.x1+3*u*t*t*c.x2+t*t*t*c.x3,u*u*u*c.y0+3*u*u*t*c.y1+3*u*t*t*c.y2+t*t*t*c.y3]};
const cubicLen=(c)=>{let l=0,prev=cubicPoint(c,0);for(let j=1;j<=24;j++){const q=cubicPoint(c,j/24);l+=Math.hypot(q[0]-prev[0],q[1]-prev[1]);prev=q;}return l};
const sampleCubics=(cubics,n)=>{
  const lens=cubics.map(cubicLen), total=lens.reduce((a,b)=>a+b,0), acc=[];let z=0;
  for(const l of lens){z+=l;acc.push(z)}
  const pts=[];
  for(let k=0;k<n;k++){
    const target=(k/n)*total; let idx=0;while(idx<acc.length-1&&target>acc[idx])idx++;
    const before=idx?acc[idx-1]:0, span=Math.max(1e-9,lens[idx]);
    pts.push(cubicPoint(cubics[idx],Math.max(0,Math.min(1,(target-before)/span))));
  }
  return pts;
};

const parseOfficialShape = shape => {
  if(shapeCache.has(shape)) return shapeCache.get(shape);
  try{
    const m=shape.match(/url\(["']?(data:image\/svg\+xml,[^"')]+)["']?\)/i); if(!m) throw 0;
    const xml=decodeURIComponent(m[1].replace(/^data:image\/svg\+xml,/,'').replace(/\\'/g,"'"));
    const doc=new DOMParser().parseFromString(xml,'image/svg+xml'), svg=doc.documentElement;
    const vb=(svg.getAttribute('viewBox')||'0 0 100 100').trim().split(/\s+/).map(Number), path=svg.querySelector('path'); if(!path) throw 0;
    const cubics=parsePathToCubics(path.getAttribute('d')||'');
    const pts=sampleCubics(cubics,MORPH_CUBICS).map(([x,y])=>[(x-vb[0])/vb[2],(y-vb[1])/vb[3]]);
    shapeCache.set(shape,pts); return pts;
  }catch(e){
    const pts=Array.from({length:MORPH_CUBICS},(_,k)=>{const a=k/MORPH_CUBICS*Math.PI*2;return [.5+.5*Math.cos(a),.5+.5*Math.sin(a)]});
    shapeCache.set(shape,pts);return pts;
  }
};

/* Feature alignment: score cyclic offsets and both traversal directions by
   distance plus local turning similarity. This mirrors the role of
   PolygonMeasure + FeatureMapping: corners and distinctive curvature are
   encouraged to line up before interpolation starts.

   Perf: turn(base) is invariant across the shift/j loops below (it only
   depends on `base`), but was previously being recomputed *inside* the
   innermost loop -- ~18,400 redundant recalculations of a 96-point trig
   pass instead of 2. That alone was costing ~180-250ms of main-thread
   blocking on every single prev/next click, before the morph animation
   could even start, which is what made shape changes feel rigid/stuttery.
   Hoisting it out drops that to a couple of milliseconds.

   We also cache the result per (from, to) point-set pair. parseOfficialShape()
   always returns the same cached array reference for a given shape, so a
   WeakMap keyed on those references is a free, leak-safe way to make every
   repeat transition between two shapes instant after the first time. */
const alignCache=new WeakMap();
const alignMorphPoints=(from,to)=>{
  let cached=alignCache.get(from);
  if(cached){const hit=cached.get(to); if(hit) return hit;}
  else{cached=new Map();alignCache.set(from,cached);}

  const n=Math.min(from.length,to.length); if(!n)return to;
  const turn=p=>{const a=[];for(let i=0;i<n;i++){const A=p[(i+n-1)%n],B=p[i],C=p[(i+1)%n];const ab=[A[0]-B[0],A[1]-B[1]],cb=[C[0]-B[0],C[1]-B[1]];a[i]=Math.acos(Math.max(-1,Math.min(1,(ab[0]*cb[0]+ab[1]*cb[1])/(Math.hypot(...ab)*Math.hypot(...cb)||1))));}return a};
  const ft=turn(from);let best=null,bestScore=Infinity;
  for(const base of [to,[...to].reverse()]){
    const tb=turn(base);
    for(let shift=0;shift<n;shift++){
      let score=0;
      for(let j=0;j<n;j++){const q=base[(j+shift)%n],dx=from[j][0]-q[0],dy=from[j][1]-q[1];const ti=Math.abs(ft[j]-tb[(j+shift)%n]);score+=dx*dx+dy*dy+ti*ti*.18;}
      if(score<bestScore){bestScore=score;best=Array.from({length:n},(_,j)=>base[(j+shift)%n]);}
    }
  }
  cached.set(to,best);
  return best;
};

const pathForPoints=pts=>'M'+pts.map(([x,y])=>`${(x*100).toFixed(3)},${(y*100).toFixed(3)}`).join(' L ')+' Z';

const ensureMorphSvg=button=>{
  let svg=button.querySelector('.morph-shape-svg');
  if(!svg){
    svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.classList.add('morph-shape-svg');
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('preserveAspectRatio','none');
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.classList.add('morph-shape-path');
    svg.appendChild(path);
    button.insertBefore(svg,button.firstChild);
  }
  return {svg,path:svg.querySelector('.morph-shape-path')};
};

/*
 * M3 Expressive shapes also have an orientation.  In the original
 * ShapeCanvas-style pipeline this is part of the shape geometry rather than
 * a rotation of the whole button.  We reproduce that here by deriving a
 * stable orientation from the actual silhouette and then choosing the closest
 * 45-degree orientation.  During a morph the SVG path rotates together with
 * the changing outline, so the shape can turn into its next orientation instead
 * of simply changing silhouette in place.
 */
const shapeOrientation = shape => {
  const pts=parseOfficialShape(shape);
  let cx=0,cy=0;
  for(const [x,y] of pts){cx+=x;cy+=y;}
  cx/=pts.length; cy/=pts.length;
  let xx=0,xy=0,yy=0;
  for(const [x,y] of pts){const dx=x-cx,dy=y-cy;xx+=dx*dx;xy+=dx*dy;yy+=dy*dy;}
  const angle=.5*Math.atan2(2*xy,xx-yy)*180/Math.PI;
  let snapped=Math.round(angle/45)*45;
  while(snapped>180) snapped-=360;
  while(snapped<=-180) snapped+=360;
  return snapped;
};

const shortestAngle=(a,b)=>{
  let d=(b-a+540)%360-180;
  return a+d;
};


const setOfficialShape=(button,shape)=>{
  button.classList.add('official-shape');
  button.dataset.shape=shape;
  const {path}=ensureMorphSvg(button);
  path.setAttribute('d',pathForPoints(parseOfficialShape(shape)));
  const angle=shapeOrientation(shape);
  button._shapeRotation=angle;
  path.style.transform=`rotate(${angle}deg)`;
};

const morphOfficialShape=(button,fromShape,toShape,duration=350)=>{
  const {path}=ensureMorphSvg(button),from=parseOfficialShape(fromShape),to=alignMorphPoints(from,parseOfficialShape(toShape));
  const fromAngle=Number.isFinite(button._shapeRotation)?button._shapeRotation:shapeOrientation(fromShape);
  const toAngle=shortestAngle(fromAngle,shapeOrientation(toShape));
  cancelAnimationFrame(button._morphFrame||0);const start=performance.now();
  /* M3 Expressive fast-spatial-style spring. Overshoot is applied to morph
     progress, not to the button element, so the silhouette itself feels alive. */
  const ease=t=>{const w=1.35;return 1-Math.exp(-7.2*t)*(Math.cos(w*8.5*t)+0.55*Math.sin(w*8.5*t));};
  const frame=now=>{
    const t=Math.min(1,(now-start)/duration),e=ease(t);
    const pts=from.map((p,i)=>[p[0]+(to[i][0]-p[0])*e,p[1]+(to[i][1]-p[1])*e]);
    const angle=fromAngle+(toAngle-fromAngle)*e;
    path.setAttribute('d',pathForPoints(pts));
    path.style.transform=`rotate(${angle}deg)`;
    if(t<1) button._morphFrame=requestAnimationFrame(frame);
    else {
      button._morphFrame=0;
      button._shapeRotation=toAngle;
      path.setAttribute('d',pathForPoints(to));
      path.style.transform=`rotate(${toAngle}deg)`;
    }
  };
  button._morphFrame=requestAnimationFrame(frame);
};

const applyOfficialShape = (button, morph=false) => {
  const current=button.dataset.shape || '';
  const nextShape=getRandomShape(current);
  if(!morph || !current){
    setOfficialShape(button,nextShape);
    return;
  }
  // No classList('morphing')/forced-reflow dance here anymore: the
  // ".official-shape.morphing" rule that dance existed to restart was fully
  // neutralized (animation:none/transition:none !important) by the later
  // "Smooth morph only" CSS block, so the class has had zero visual effect
  // for a while now — the actual morph is 100% driven by the path-point
  // interpolation in morphOfficialShape() below. Restarting a dead animation
  // isn't free: `void button.offsetWidth` forces a synchronous layout flush,
  // and that was firing on *every* Next/Prev click before this animation
  // even started. That's what made shape changes feel rigid/stuttery.
  morphOfficialShape(button,current,nextShape,350);
  button.dataset.shape=nextShape;
};

const animateNavigation = (button, direction) => {

    if(dialogTop){
      dialogTop.classList.remove('expressive-update');
      void dialogTop.offsetWidth;
      dialogTop.classList.add('expressive-update');
    }
    // #lbCount moves between .dialog-top (desktop) and .dialog-bottom
    // (mobile) depending on viewport — see relocateLbCountForViewport in
    // the main script — so its "pop" animation is triggered directly here
    // instead of solely through the .dialog-top.expressive-update ancestor
    // selector above, which only still reaches it on desktop.
    lbCount.classList.remove('expressive-update-count');
    void lbCount.offsetWidth;
    lbCount.classList.add('expressive-update-count');

    applyOfficialShape(button, true);
    // Morph the loading spinner's silhouette in lockstep with the nav
    // button that was pressed, so it's already mid-transition (or ready
    // with a fresh shape) whenever the next wallpaper turns out slow to
    // load — same spring, same shape family, just spinning in place.
    if(lbSpinner) applyOfficialShape(lbSpinner, true);

    // Rotation belongs to the SVG silhouette, not the button container.
    // This lets each Material shape enter with its own orientation while the
    // button's press feedback remains independent.
    button.style.removeProperty('--expressive-rotate');
    button.classList.remove('expressive-press');

    clearTimeout(motionTimer);
    motionTimer = setTimeout(() => {
      dialogTop?.classList.remove('expressive-update');
      lbCount.classList.remove('expressive-update-count');
      button.classList.remove('expressive-press');
    }, 520);
  };

  actionButtons.forEach(button => {
    // Stock-Android-style press feedback: scale down the instant the
    // finger/cursor lands, ease back up the instant it lifts. Driven
    // entirely by real pointer timing (via the .pressing CSS transition)
    // rather than a fixed-duration animation, so it always feels connected
    // to the touch — tap fast or hold, it tracks either way. This is
    // fully independent of the shape morph spring triggered on click.
    button.addEventListener('pointerdown', event => {
      const rect = button.getBoundingClientRect();
      button.style.setProperty('--ripple-x', `${((event.clientX - rect.left) / rect.width) * 100}%`);
      button.style.setProperty('--ripple-y', `${((event.clientY - rect.top) / rect.height) * 100}%`);
      button.classList.add('pressing');
    });
    ['pointerup','pointercancel','pointerleave'].forEach(type => {
      button.addEventListener(type, () => button.classList.remove('pressing'));
    });
  });


  actionButtons.forEach(applyOfficialShape);
  if(lbSpinner) setOfficialShape(lbSpinner, getRandomShape(''));

  // Pre-parse every silhouette into its cached 96-point outline while the
  // browser is idle, so the first time navigation reaches a shape it hasn't
  // shown yet, there's no SVG-parsing work sitting inside the click handler.
  const warmShapeCache = () => officialShapes.forEach(parseOfficialShape);
  if('requestIdleCallback' in window) requestIdleCallback(warmShapeCache, {timeout:1500});
  else setTimeout(warmShapeCache, 300);

  // Capture clicks before the existing listeners run, then animate the
  // resulting lightbox transition without replacing the navigation logic.
  prev.addEventListener('click', () => animateNavigation(prev, -1), true);
  next.addEventListener('click', () => animateNavigation(next, 1), true);

  // Also give the image a little bounce after keyboard navigation.
  document.addEventListener('keydown', event => {
    if(event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    const lb = document.getElementById('lightbox');
    if(!lb || lb.hidden) return;
    const button = event.key === 'ArrowRight' ? next : prev;
    if(button) animateNavigation(button, event.key === 'ArrowRight' ? 1 : -1);
  }, true);
})();

/* ---------- Deep link from the Widget Presets page ----------
   The presets page (blapples_widget_presets.html) links its "wallpapers
   used" thumbnails to this page as
   blapples_wallpaper_collection.html?wallpaper=<filename>. On load, find
   that wallpaper (once the gallery has finished loading — it's async),
   scroll to it, pulse it, and open the lightbox. */
function findFrameByFilename(filename){
  const target = filename.trim().toLowerCase();
  return Object.values(frameData).find(f => f && f.filename && f.filename.toLowerCase() === target) || null;
}

function waitForFrameByFilename(filename, timeoutMs = 8000){
  return new Promise(resolve => {
    const started = Date.now();
    (function poll(){
      const found = findFrameByFilename(filename);
      if(found) return resolve(found);
      if(Date.now() - started >= timeoutMs) return resolve(null);
      setTimeout(poll, 150);
    })();
  });
}

async function openWallpaperFromDeepLink(filename){
  const frame = await waitForFrameByFilename(filename);
  if(!frame || !frame._card) return;
  const card = frame._card;
  card.scrollIntoView({ behavior:'smooth', block:'center' });
  setTimeout(() => {
    card.classList.add('pulse');
    setTimeout(() => {
      card.classList.remove('pulse');
      openLightbox(frame.frameNo);
    }, 350);
  }, 450);
}

const deepLinkWallpaper = new URLSearchParams(window.location.search).get('wallpaper');
if(deepLinkWallpaper) openWallpaperFromDeepLink(deepLinkWallpaper);
</script>
