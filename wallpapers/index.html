<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#15130F">
<meta name="description" content="A hand-picked wallpaper gallery with a surprise-me pick and one-tap downloads.">
<title>Blapples Wallpaper Collection</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.github.com">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Material Expressive-inspired olive / sage palette from the reference */
    --md-primary:#c7d39a;
    --md-on-primary:#171a12;
    --md-primary-container:#4f5b36;
    --md-on-primary-container:#e4e9d2;

    --md-secondary:#8f9d70;
    --md-on-secondary:#151811;
    --md-secondary-container:#303722;
    --md-on-secondary-container:#dce4c2;

    --md-tertiary:#aeb982;
    --md-on-tertiary:#181b13;

    --md-surface:#11130f;
    --md-surface-container-low:rgba(22,25,18,.82);
    --md-surface-container:rgba(27,31,22,.88);
    --md-surface-container-high:rgba(35,40,27,.92);
    --md-surface-container-highest:rgba(45,51,33,.95);
    --md-on-surface:#eef1e4;
    --md-on-surface-variant:#aeb69a;
    --md-outline:rgba(190,205,151,.24);

    /* Dynamic color-filter atmosphere. These stay on the current sage theme
       until a specific color filter is selected. */
    --theme-glow-1:rgba(150,170,105,.14);
    --theme-glow-2:rgba(115,140,76,.12);
    --theme-bg-1:#0b0d0a;
    --theme-bg-2:#151912;
    --theme-bg-3:#090b08;

    --shape-xs:10px;
    --shape-sm:18px;
    --shape-md:24px;
    --shape-lg:28px;
    --shape-xl:28px;
    --shape-expressive:28px;
    --shape-full:999px;

    --elev-1:0 2px 10px rgba(18,22,13,.18);
    --elev-2:0 8px 28px rgba(18,22,13,.24);
    --elev-3:0 18px 50px rgba(10,13,8,.34);

    --spring:cubic-bezier(.22,1.35,.36,1);
    --standard:cubic-bezier(.2,0,0,1);
    --font:'Roboto Flex',Roboto,system-ui,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}

  body{
    min-height:100vh;
    color:var(--md-on-surface);
    font-family:var(--font);
    font-optical-sizing:auto;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(circle at 18% 15%,var(--theme-glow-1),transparent 30%),
      radial-gradient(circle at 85% 30%,var(--theme-glow-2),transparent 32%),
      linear-gradient(145deg,var(--theme-bg-1),var(--theme-bg-2) 48%,var(--theme-bg-3));
    overflow-x:hidden;
    transition:background .65s ease,color .35s ease;
  }

  /* Ambient wallpaper behind the whole interface */
  .ambient-bg{
    position:fixed;
    inset:-6%;
    z-index:-3;
    background-position:center;
    background-size:cover;
    opacity:.40;
    filter:blur(34px) saturate(.72);
    transform:scale(1.08);
    transition:background-image .8s ease,opacity .5s ease;
  }
  .ambient-scrim{
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;
    background:
      linear-gradient(180deg,rgba(8,10,7,.60),rgba(9,12,8,.82)),
      radial-gradient(circle at 50% 20%,transparent 0 25%,rgba(5,7,5,.42) 100%);
  }

  button{font:inherit;color:inherit;border:0;background:none}

  .topbar{
    position:relative;
    top:auto;
    z-index:30;
    width:min(1440px,calc(100% - 36px));
    margin:18px auto 28px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    background:rgba(18,21,15,.90);
    border:1px solid rgba(190,205,151,.12);
    border-radius:var(--shape-lg);
    box-shadow:var(--elev-2);
    backdrop-filter:blur(24px) saturate(1.12);
    -webkit-backdrop-filter:blur(24px) saturate(1.12);
    transition:padding .24s cubic-bezier(.22,1.35,.36,1),width .24s cubic-bezier(.22,1.35,.36,1),border-radius .24s ease,box-shadow .24s ease;
  }

  .header-placeholder{
    display:none;
    width:100%;
    pointer-events:none;
  }

  .mobile-top-btn{
    display:none;
  }

  .topbar.is-compact{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:min(1120px,calc(100% - 36px));
    margin:0;
    padding:10px 14px;
    border-radius:22px;
    z-index:30;
    box-shadow:var(--elev-3);
  }

  .topbar.is-compact .brand{gap:10px}
  .topbar.is-compact .brand-mark{width:38px;height:38px;border-radius:16px}
  .topbar.is-compact .brand-mark svg{width:19px;height:19px}
  .topbar.is-compact h1{font-size:20px}
  .topbar.is-compact .subtitle,.topbar.is-compact .eyebrow-chip{display:none}

  /* Compact desktop header: keep every filter visible without a horizontal scroller. */
  .topbar.is-compact{
    gap:12px;
  }
  .topbar.is-compact .brand{
    flex:0 0 auto;
    gap:10px;
  }
  .topbar.is-compact .brand-copy{
    width:190px;
  }
  .topbar.is-compact .color-filter{
    flex:1 1 0;
    width:auto;
    min-width:0;
    margin:0;
  }
  .topbar.is-compact .color-filter-track{
    width:100%;
    min-width:0;
    padding:0;
    gap:6px;
    overflow:visible;
    justify-content:space-between;
  }
  .topbar.is-compact .color-chip{
    flex:0 1 auto;
    min-width:0;
    padding:7px 9px 7px 7px;
    gap:6px;
    font-size:12px;
    box-shadow:none;
  }
  .topbar.is-compact .color-chip-swatch{
    width:22px;
    height:22px;
    flex:0 0 22px;
  }

  @media (min-width:641px) and (max-width:900px){
    .topbar.is-compact{
      width:calc(100% - 24px);
      padding:8px 10px;
      gap:8px;
    }
    .topbar.is-compact .brand-copy{width:145px;}
    .topbar.is-compact h1{font-size:17px;}
    .topbar.is-compact .brand-mark{width:34px;height:34px;}
    .topbar.is-compact .brand-mark svg{width:17px;height:17px;}
    .topbar.is-compact .color-filter-track{gap:3px;}
    .topbar.is-compact .color-chip{
      padding:6px 6px 6px 5px;
      gap:4px;
      font-size:10px;
    }
    .topbar.is-compact .color-chip-swatch{
      width:18px;
      height:18px;
      flex-basis:18px;
    }
  }

  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }

  .brand-mark{
    width:52px;
    height:52px;
    flex:0 0 auto;
    display:grid;
    place-items:center;
    border-radius:var(--shape-lg);
    background:var(--md-primary);
    color:var(--md-on-primary);
    box-shadow:0 5px 18px rgba(0,0,0,.18);
  }

  .brand-mark svg{width:25px;height:25px;display:block}

  .brand-copy{min-width:0}
  h1{
    margin:0;
    font-size:clamp(25px,3vw,36px);
    line-height:1;
    letter-spacing:-.035em;
    font-weight:700;
  }

  .subtitle{
    margin:6px 0 0;
    color:var(--md-on-surface-variant);
    font-size:13px;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:55vw;
  }

  .eyebrow-chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:10px 14px;
    border-radius:var(--shape-full);
    background:rgba(166,184,117,.10);
    color:var(--md-on-surface-variant);
    border:1px solid rgba(235,240,214,.12);
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .eyebrow-chip svg{width:14px;height:14px}

  /* Color filter — Material Expressive filter-chip row for narrowing the
     gallery to wallpapers that share a dominant color. Colors are sampled
     client-side (see computeFrameColor) and bucketed into a fixed palette,
     so chips fade in one at a time as each wallpaper finishes classifying. */
  .color-filter{
    width:min(1440px,calc(100% - 36px));
    margin:0 auto 22px;
  }

  .color-filter-track{
    display:flex;
    align-items:center;
    gap:8px;
    padding:2px 4px 10px;
    overflow-x:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .color-filter-track::-webkit-scrollbar{display:none}

  .color-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
    padding:10px 16px 10px 10px;
    border-radius:var(--shape-full);
    background:var(--md-surface-container-low);
    border:1px solid var(--md-outline);
    color:var(--md-on-surface-variant);
    font-size:13px;
    font-weight:650;
    letter-spacing:.01em;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:var(--elev-1);
    opacity:0;
    transform:translateY(6px) scale(.94);
    transition:
      background .25s var(--standard),
      color .2s ease,
      border-color .25s var(--standard),
      box-shadow .25s var(--standard),
      transform .35s var(--spring),
      border-radius .35s var(--spring),
      opacity .3s ease;
  }
  .color-chip.chip-in{opacity:1;transform:none}

  .color-chip:hover{
    transform:translateY(-2px);
    box-shadow:var(--elev-2);
    border-color:rgba(236,241,211,.28);
  }
  .color-chip.chip-in:active{transform:scale(.95)}

  .color-chip-swatch{
    width:18px;
    height:18px;
    border-radius:50%;
    flex:0 0 auto;
    border:1px solid rgba(255,255,255,.35);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);
  }
  .color-chip-swatch--all{
    background:conic-gradient(from 180deg,#e0483e,#e08a3e,#e0c93e,#6cbf5c,#4c7fe0,#8a5ce0,#e0483e);
  }

  .color-chip-count{
    color:var(--md-on-surface-variant);
    font-weight:700;
    opacity:.6;
    font-size:11px;
    margin-left:-2px;
  }

  .color-chip.is-active{
    background:var(--md-primary);
    color:var(--md-on-primary);
    border-color:transparent;
    box-shadow:var(--elev-2);
  }
  .color-chip.is-active .color-chip-count{color:var(--md-on-primary);opacity:.65}
  .color-chip.is-active .color-chip-swatch{
    border-color:rgba(23,26,18,.4);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),0 0 0 3px rgba(23,26,18,.14);
  }

  /* Shown in the track while colors are still being sampled; reuses the
     same shimmer keyframes as the wallpaper card skeletons below. */
  .color-chip-skeleton{
    flex:0 0 auto;
    height:38px;
    border-radius:var(--shape-full);
    background:linear-gradient(
      110deg,
      rgba(17,20,14,.78) 30%,
      rgba(58,70,38,.55) 50%,
      rgba(17,20,14,.78) 70%
    );
    background-size:200% 100%;
    animation:shimmer 1.6s ease-in-out infinite;
  }

  /* Cards hidden/shown by the color filter fade and settle instead of
     popping instantly, echoing the spring used for the initial card reveal. */
  .grid .card.filter-hidden{
    opacity:0;
    transform:scale(.94) translateY(8px);
    pointer-events:none;
    transition:opacity .22s var(--standard),transform .22s var(--standard);
  }

  .grid{
    width:min(1440px,calc(100% - 36px));
    margin:0 auto;
    padding:0 0 150px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
    gap:18px;
    align-items:start;
  }

  /*
    The reference uses wallpapers as visual surfaces rather than cropped
    square thumbnails. Cards therefore keep the entire image visible.
  */
  .card{
    position:relative;
    width:100%;
    aspect-ratio:16 / 9;
    height:auto;
    min-height:0;
    overflow:hidden;
    cursor:pointer;
    padding:0;
    border-radius:var(--shape-lg);
    background:rgba(45,50,35,.72);
    border:1px solid rgba(241,245,218,.12);
    box-shadow:var(--elev-1);
    isolation:isolate;
    opacity:0;
    transform:translateY(18px) scale(.985);
    transition:
      opacity .55s var(--spring),
      transform .55s var(--spring),
      box-shadow .35s var(--standard),
      border-radius .45s var(--spring);
    content-visibility:auto;
    contain-intrinsic-size:320px 340px;
  }
  .card.visible{opacity:1;transform:none}

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:linear-gradient(
      180deg,
      rgba(255,255,255,.035),
      transparent 26%,
      transparent 62%,
      rgba(20,24,14,.48)
    );
  }

  .card:hover,.card:focus-visible{
    box-shadow:var(--elev-3);
    transform:translateY(-6px) scale(1.012);
    border-color:rgba(236,241,211,.24);
    border-radius:var(--shape-lg);
    z-index:2;
  }

  .card img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    background:
      radial-gradient(circle at 50% 35%,rgba(177,190,140,.20),transparent 55%),
      rgba(8,10,7,.92);
    transition:transform .7s var(--standard),filter .5s ease;
  }

  .card:hover img{
    transform:scale(1.025);
    filter:saturate(1.04);
  }

  /* Wallpaper names are hidden on the cards to keep the gallery compact.
     The name is still shown in the lightbox after clicking a wallpaper. */
  .card-overlay{
    display:none;
  }

  .card-title{
    font-size:15px;
    font-weight:650;
    letter-spacing:-.01em;
    color:var(--md-on-surface);
  }

  /* ---------- "New" badge + New Wallpapers section ----------
     A wallpaper counts as new for 7 days after this browser first notices
     it (tracked client-side — see trackNewWallpapers in the script). The
     badge shows on the card wherever it appears; the dedicated section
     further down is just a shortcut to the same "new" wallpapers. */
  .new-badge{
    position:absolute;
    top:10px;
    left:10px;
    z-index:3;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 11px 5px 9px;
    border-radius:var(--shape-full);
    background:var(--md-primary);
    color:var(--md-on-primary);
    font-size:11px;
    font-weight:800;
    letter-spacing:.05em;
    text-transform:uppercase;
    box-shadow:var(--elev-2);
    pointer-events:none;
  }
  .new-badge::before{
    content:"";
    width:6px;
    height:6px;
    flex:0 0 auto;
    border-radius:50%;
    background:var(--md-on-primary);
    animation:new-badge-pulse 1.8s ease-in-out infinite;
  }
  @keyframes new-badge-pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(.7)}
  }

  .new-section{
    width:min(1440px,calc(100% - 36px));
    margin:-6px auto 40px;
  }
  .new-section[hidden]{display:none}

  .new-section-head{
    display:flex;
    flex-direction:column;
    gap:3px;
    margin:0 0 16px;
    padding:0 2px;
  }
  .new-section-title{
    display:flex;
    align-items:center;
    gap:9px;
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:-.02em;
    color:var(--md-on-surface);
  }
  .new-section-icon{
    width:18px;
    height:18px;
    flex:0 0 auto;
    color:var(--md-primary);
  }
  .new-section-sub{
    margin:0;
    font-size:13px;
    color:var(--md-on-surface-variant);
  }

  .new-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
    gap:18px;
  }

  @media (max-width:900px){
    .new-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  }

  @media (prefers-reduced-motion:reduce){
    .new-badge::before{animation:none}
  }

  /* ---------- Viewport-based image loading ---------- */
/*
 * Images are only assigned their real source when they are close to the
 * viewport. This keeps cards above/below the visible area cheap to render.
 * A small preload margin makes scrolling feel instant without loading the
 * entire collection at once.
 */
.card img{
  content-visibility:auto;
}

.card img[data-lazy-src]{
  opacity:0;
  transition:opacity .3s ease;
}

.card img[data-lazy-loaded="true"]{
  opacity:1;
}

@media (prefers-reduced-motion: reduce){
  .card img[data-lazy-src],
  .card img[data-lazy-loaded="true"]{
    transition:none;
  }
}

/* ---------- Scroll reveal for wallpaper preview cards ---------- */
  .card{
    opacity:0;
    transform:translate3d(0,38px,0) scale(.97);
    filter:saturate(.88);
    transition:
      opacity .65s var(--standard),
      transform .7s var(--spring),
      filter .55s ease;
    will-change:transform,opacity;
  }

  .card.is-visible{
    opacity:1;
    transform:translate3d(0,0,0) scale(1);
    filter:saturate(1);
  }

  .card.is-visible:hover{
    transform:translate3d(0,-6px,0) scale(1.012);
  }

  .card:nth-child(2n){ transition-delay:40ms; }
  .card:nth-child(3n){ transition-delay:80ms; }

  @media (prefers-reduced-motion: reduce){
    .card,
    .card.is-visible,
    .card.is-visible:hover{
      opacity:1;
      transform:none;
      filter:none;
      transition:none;
    }
  }

  .card:focus-visible{
    outline:2px solid var(--md-primary);
    outline-offset:3px;
  }

  .skeleton{
    aspect-ratio:16 / 9;
    height:auto;
    min-height:0;
    border-radius:var(--shape-lg);
    background:linear-gradient(
      110deg,
      rgba(17,20,14,.78) 30%,
      rgba(58,70,38,.55) 50%,
      rgba(17,20,14,.78) 70%
    );
    background-size:200% 100%;
    animation:shimmer 1.6s ease-in-out infinite;
  }

  @keyframes shimmer{
    0%{background-position:200% 0}
    100%{background-position:-200% 0}
  }

  @keyframes pulse-ring{
    0%{box-shadow:var(--elev-2),0 0 0 0 rgba(217,223,189,.50)}
    70%{box-shadow:var(--elev-2),0 0 0 18px rgba(217,223,189,0)}
    100%{box-shadow:var(--elev-1),0 0 0 0 rgba(217,223,189,0)}
  }
  .card.pulse{animation:pulse-ring 1s var(--standard)}

  .fab{
    position:fixed;
    right:28px;
    bottom:28px;
    z-index:40;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:15px 22px 15px 18px;
    border-radius:var(--shape-lg);
    background:var(--md-primary);
    color:var(--md-on-primary);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    box-shadow:var(--elev-3);
    transition:box-shadow .25s var(--standard),transform .2s var(--spring),border-radius .35s var(--spring);
  }

  .fab:hover{
    transform:translateY(-3px) scale(1.02);
    border-radius:var(--shape-lg);
  }
  .fab:active{transform:scale(.94)}
  .fab svg{width:19px;height:19px}

  .scrim{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(20,23,15,.64);
    backdrop-filter:blur(22px) saturate(.8);
    -webkit-backdrop-filter:blur(22px) saturate(.8);
    animation:fade-in .2s ease;

<script>
/* ---------- Preview protection ---------- */
// Wallpapers can only be saved through the site's Download button.
// Disable the browser context menu and native image dragging across the page.
document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('dragstart', event => {
  if(event.target instanceof HTMLImageElement || event.target.closest?.('.card, .dialog-media')){
    event.preventDefault();
  }

/* ---------- Wallpaper source ----------
   Every image in this GitHub repo path shows up automatically — upload a
   file there and it appears here on next page load, no code changes. ---- */
const GITHUB_SOURCE = {
  user:   'Blapples',
  repo:   'wallpapers',
  path:   '',       // '' = repo root
  branch: 'main',
};

function titleFromFilename(name){
  return name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

/*
 * The GitHub file is always kept as the ORIGINAL source.
 * Cards and the lightbox use resized/compressed preview URLs so opening the
 * gallery never forces a phone/tablet/PC to download a huge wallpaper.
 * The original GitHub URL is used only when the user presses Download.
 *
 * wsrv.nl is an image-resizing proxy: it fetches the public GitHub image,
 * resizes it server-side, and returns a much smaller image.
 */
const PREVIEW_PROXY = 'https://wsrv.nl/';
const PREVIEW_QUALITY = 72;

// Phones do not need desktop-sized preview assets. Keeping these smaller
// reduces network transfer, image decoding, memory use, and GPU texture size.
const IS_MOBILE_DEVICE = window.matchMedia('(max-width: 640px)').matches ||
  /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const CARD_PREVIEW_WIDTH = IS_MOBILE_DEVICE ? 640 : 960;
const LIGHTBOX_PREVIEW_WIDTH = IS_MOBILE_DEVICE ? 1080 : 1600;

function makePreviewUrl(originalUrl, width){
  if(!originalUrl || originalUrl.startsWith('data:') || originalUrl.startsWith('blob:')){
    return originalUrl;
  }
  return `${PREVIEW_PROXY}?url=${encodeURIComponent(originalUrl)}&w=${width}&q=${PREVIEW_QUALITY}&fit=inside&output=webp`;
}

function normalizeFrame(frame){
  if(!frame || typeof frame !== 'object') return frame;
  if(!frame.src) return frame;
  frame.previewSrc = frame.previewSrc || makePreviewUrl(frame.src, CARD_PREVIEW_WIDTH);
  frame.lightboxSrc = frame.lightboxSrc || makePreviewUrl(frame.src, LIGHTBOX_PREVIEW_WIDTH);
  return frame;
}

/* ---------- Color sampling (Matugen-inspired) ----------
 * Matugen does not simply average all pixels. It downsizes the wallpaper,
 * quantizes it into a palette, removes very low-chroma colors, then scores
 * the remaining candidates by visual importance/population. We mirror that
 * idea here in browser-safe JS, then map the winning source color into one
 * of our six filter families.
 */
const COLOR_SAMPLE_WIDTH = 112;

function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0, sat=0;
  const l=(max+min)/2, d=max-min;
  if(d!==0){
    sat=l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=((g-b)/d)+(g<b?6:0); break;
      case g: h=(b-r)/d+2; break;
      default: h=(r-g)/d+4;
    }
    h*=60;
  }
  return {h,s:sat,l};
}

function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d){
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  return {h,s:max===0?0:d/max,v:max};
}

// Six broad Material-like hue families. The boundaries deliberately overlap
// the natural visual regions rather than treating every shade as a new color.
function hueFamily(h){
  if(h>=345 || h<15) return 'red';
  if(h>=15 && h<45) return 'orange';
  if(h>=45 && h<75) return 'yellow';
  // Green intentionally owns mint, lime, emerald, sea-green and turquoise-green.
  if(h>=75 && h<190) return 'green';
  if(h>=190 && h<255) return 'blue';
  return 'purple';
}

const COLOR_CLASS_PALETTE = [
  {key:'red',    rgb:[224,72,62],   hue:0},
  {key:'orange', rgb:[224,138,62],  hue:30},
  {key:'yellow', rgb:[224,201,62],  hue:60},
  {key:'green',  rgb:[108,191,92],  hue:130},
  {key:'blue',   rgb:[76,127,224],  hue:220},
  {key:'purple', rgb:[138,92,224],  hue:285},
];

function hueDistance(a,b){
  const d=Math.abs(a-b);
  return Math.min(d,360-d);
}

function classifyColor(r,g,b){
  const hsv=rgbToHsv(r,g,b);
  return hueFamily(hsv.h);
}

/*
 * Matugen-style palette extraction:
 *  1. resize to 112px
 *  2. quantize RGB into compact bins
 *  3. discard near-gray colors (low chroma)
 *  4. score candidates by population + chroma + a mild saturation bonus
 *  5. choose the strongest representative color
 *
 * This is intentionally NOT a plain average. A small but strongly saturated
 * blue area can matter, while a huge black/white background cannot incorrectly
 * force a colorful wallpaper into a neutral bucket.
 */
function computeFrameColor(frame){
  return new Promise(resolve=>{
    if(!frame?.src) return resolve(null);
    let settled=false;
    const finish=value=>{ if(settled) return; settled=true; clearTimeout(timer); resolve(value); };
    const timer=setTimeout(()=>finish(null),7000);
    const probe=new Image();
    probe.crossOrigin='anonymous';
    probe.onload=()=>{
      try{
        const w=COLOR_SAMPLE_WIDTH;
        const h=Math.max(1,Math.round((probe.naturalHeight/probe.naturalWidth)*w));
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=Math.min(h,112);
        const ctx=canvas.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(probe,0,0,canvas.width,canvas.height);
        const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
        const familyScores=new Map();
        const familyPixels=new Map();
        let neutral=0;
        const bins=new Map();

        for(let i=0;i<data.length;i+=4){
          if(data[i+3]<16) continue;
          const r=data[i],g=data[i+1],b=data[i+2];
          const hsv=rgbToHsv(r,g,b);
          // Quantize first so similar pastel/dark shades reinforce each other.
          const qr=Math.round(r/16)*16, qg=Math.round(g/16)*16, qb=Math.round(b/16)*16;
          const k=(qr<<16)|(qg<<8)|qb;
          const item=bins.get(k);
          if(item) item.count++;
          else bins.set(k,{r:qr,g:qg,b:qb,count:1});
        }

        for(const item of bins.values()){
          const hsv=rgbToHsv(item.r,item.g,item.b);
          const population=item.count;
          if(hsv.s<0.10 || hsv.v<0.08){ neutral+=population; continue; }
          const family=hueFamily(hsv.h);
          // Population dominates. Saturation/value gently emphasize actual color
          // without letting tiny vivid accents beat the wallpaper's main family.
          const strength=population*(0.80 + 0.20*hsv.s)*(0.78 + 0.22*hsv.v);
          familyScores.set(family,(familyScores.get(family)||0)+strength);
          familyPixels.set(family,(familyPixels.get(family)||0)+population);
        }

        if(!familyScores.size){
          // Neutral wallpaper: use the average hue only as a deterministic fallback.
          let sr=0,sg=0,sb=0,n=0;
          for(let i=0;i<data.length;i+=4){ if(data[i+3]<16) continue; sr+=data[i];sg+=data[i+1];sb+=data[i+2];n++; }
          if(!n) return finish(null);
          const r=Math.round(sr/n),g=Math.round(sg/n),b=Math.round(sb/n);
          return finish({r,g,b,key:'blue'});
        }

        let key='green',best=-1;
        for(const [family,score] of familyScores){
          if(score>best){best=score;key=family;}
        }

        // Representative color = weighted average of the winning family's
        // quantized palette colors. This keeps pastel/dark shades in the same family.
        let rr=0,gg=0,bb=0,ww=0;
        for(const item of bins.values()){
          const hsv=rgbToHsv(item.r,item.g,item.b);
          if(hsv.s<0.10 || hsv.v<0.08 || hueFamily(hsv.h)!==key) continue;
          const weight=item.count*(0.8+0.2*hsv.s);
          rr+=item.r*weight; gg+=item.g*weight; bb+=item.b*weight; ww+=weight;
        }
        const r=Math.round(rr/ww),g=Math.round(gg/ww),b=Math.round(bb/ww);
        finish({r,g,b,key});
      }catch(err){ finish(null); }
    };
    probe.onerror=()=>finish(null);
    probe.src=makePreviewUrl(frame.src,COLOR_SAMPLE_WIDTH);
  });
}
async function fetchWallpapersFromGitHub(src){
  const apiUrl = `https://api.github.com/repos/${src.user}/${src.repo}/contents/${src.path}?ref=${src.branch}`;
  const res = await fetch(apiUrl, { headers:{ Accept:'application/vnd.github+json' } });
  if(!res.ok) throw new Error(`GitHub API responded ${res.status}`);
  const files = await res.json();
  if(!Array.isArray(files)) throw new Error('Unexpected GitHub API response');
  const imageExt = /\.(png|jpe?g|webp|gif)$/i;
  return files
    .filter(f => f.type === 'file' && imageExt.test(f.name))
    .sort((a,b) => a.name.localeCompare(b.name))
    .map((f, i) => {
      const originalUrl = f.download_url;
      return normalizeFrame({
        title: titleFromFilename(f.name),
        src: originalUrl,
        previewSrc: makePreviewUrl(originalUrl, CARD_PREVIEW_WIDTH),
        lightboxSrc: makePreviewUrl(originalUrl, LIGHTBOX_PREVIEW_WIDTH),
        filename: f.name,
        frameNo: i + 1,
      });
    });
}

function hexToRgb(hex){ const n=parseInt(hex.replace('#',''),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function hexToRgba(hex,a){ const [r,g,b]=hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }

function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ seed>>>15, 1 | seed);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260815);
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

const FAMILIES = [
  { bg:'#2a1607', colors:['#ffb68c','#7c3900','#e8c36e'], titles:['Warm Horizon','Amber Field','Coral Fade'] },
  { bg:'#06231c', colors:['#7bd9c0','#005141','#ffb68c'], titles:['Deep Teal','Cool Current','Seafoam'] },

  { bg:'#220a12', colors:['#f28fa3','#ffb68c','#e8c36e'], titles:['Rosewater','Petal Static','Warm Bloom'] },
];

function paintWallpaper(ctx,w,h,family){
  ctx.fillStyle = family.bg;
  ctx.fillRect(0,0,w,h);
  const blobCount = 3 + Math.floor(rand()*2);
  for(let i=0;i<blobCount;i++){
    const hex = family.colors[i % family.colors.length];
    const cx = rand()*w, cy = rand()*h;
    const r = (0.4 + rand()*0.4) * Math.max(w,h);
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    grad.addColorStop(0, hexToRgba(hex,0.95));
    grad.addColorStop(1, hexToRgba(hex,0));
    ctx.globalCompositeOperation = i===0 ? 'source-over' : 'lighten';
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
  }
  ctx.globalCompositeOperation = 'source-over';
  const vgrad = ctx.createRadialGradient(w/2,h/2,h*0.15,w/2,h/2,h*0.8);
  vgrad.addColorStop(0,'rgba(0,0,0,0)');
  vgrad.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle = vgrad;
  ctx.fillRect(0,0,w,h);
}
function buildPlaceholderFrames(){
  const list = [];
  FAMILIES.forEach(family=>{ family.titles.forEach(title=>{ list.push({ title, family }); }); });

}

/* ---------- Build the grid ---------- */
const W = 480, H = 360;
const pad = n => String(n).padStart(2,'0');
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const grid = document.getElementById('grid');
const frameData = {};

/*
 * Keep a small local copy of the GitHub wallpaper manifest.
 *
 * This is important when the HTML file is opened directly from disk
 * (file://). Browsers can occasionally block, delay, or rate-limit the
 * GitHub API on a refresh. Previously the page waited for that request
 * before building the cards, so a refresh could leave an empty gallery.
 *
 * The cache lets the last successfully loaded wallpaper list render
 * immediately, while GitHub is refreshed quietly in the background.
 */
const WALLPAPER_CACHE_KEY = 'blapples-wallpaper-manifest-v2';

function readWallpaperCache(){
  try{
    const raw = localStorage.getItem(WALLPAPER_CACHE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!Array.isArray(data) || !data.length) return null;
    return data.filter(item =>
      item &&
      typeof item.title === 'string' &&
      typeof item.src === 'string' &&
      typeof item.filename === 'string'
    ).map(normalizeFrame);
  }catch(err){
    console.warn('Wallpaper cache could not be read:', err);
    return null;
  }
}

function writeWallpaperCache(frames){
  try{
    const clean = frames.map(frame => ({
      title: frame.title,
      src: frame.src,
      previewSrc: frame.previewSrc || makePreviewUrl(frame.src, CARD_PREVIEW_WIDTH),
      lightboxSrc: frame.lightboxSrc || makePreviewUrl(frame.src, LIGHTBOX_PREVIEW_WIDTH),
      filename: frame.filename,
      frameNo: frame.frameNo
    }));
    localStorage.setItem(WALLPAPER_CACHE_KEY, JSON.stringify(clean));
  }catch(err){
    // Storage can be unavailable in private/file contexts; the gallery
    // still works without it.
    console.warn('Wallpaper cache could not be written:', err);
  }
}

/* ---------- "New" wallpaper tracking ----------
 * There's no backend, so "new" is tracked the same way the manifest cache
 * above already is: locally, per browser, keyed by filename. The first
 * time this code ever runs, the current collection becomes the baseline
 * (nothing is "new" yet, so shipping this feature doesn't badge every
 * existing wallpaper). After that, any filename this browser hasn't seen
 * before is stamped with the current time and counts as new for
 * NEW_WINDOW_MS - after which it quietly goes back to being a normal
 * card with no badge, in its normal spot in the main grid.
 */
const NEW_TRACKING_KEY = 'blapples-wallpaper-first-seen-v1';
const NEW_WINDOW_MS = 7 * 24 * 60 * 60 * 1000; // 1 week

function readFirstSeenMap(){
  try{
    const raw = localStorage.getItem(NEW_TRACKING_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    return (data && typeof data === 'object') ? data : null;
  }catch(err){
    console.warn('New-wallpaper tracking could not be read:', err);
    return null;
  }
}

function writeFirstSeenMap(map){
  try{
    localStorage.setItem(NEW_TRACKING_KEY, JSON.stringify(map));
  }catch(err){
    console.warn('New-wallpaper tracking could not be written:', err);
  }
}

/*
 * Stamps each frame with firstSeenAt/isNew. The `isAuthoritative` flag
 * matters because init() renders twice: once from the (possibly stale or
 * incomplete) local cache for an instant paint, then again once the live
 * GitHub listing comes back. Only the live listing is allowed to decide
 * "this browser has never seen this file before" and write that decision
 * to storage - otherwise a stale cache on a fresh browser could wrongly
 * treat older wallpapers as brand new just because they were missing from
 * that cache.
 */
function trackNewWallpapers(frames, isAuthoritative=true){
  const now = Date.now();
  let map = readFirstSeenMap();

  if(!isAuthoritative){
    frames.forEach(frame=>{
      const firstSeenAt = frame.filename ? map?.[frame.filename] : undefined;
      frame.firstSeenAt = firstSeenAt;
      frame.isNew = firstSeenAt != null && (now - firstSeenAt) < NEW_WINDOW_MS;
    });
    return frames;
  }

  const isBootstrap = !map;
  if(!map) map = {};

  const seenFilenames = new Set();
  frames.forEach(frame=>{
    if(!frame.filename) return;
    seenFilenames.add(frame.filename);
    if(!(frame.filename in map)){
      // Brand new to this browser's tracking. On the very first run ever
      // (no stored map at all) back-date it so the existing collection
      // doesn't suddenly launch as "new"; otherwise stamp it with now.
      map[frame.filename] = isBootstrap ? (now - NEW_WINDOW_MS - 1) : now;
    }
    const firstSeenAt = map[frame.filename];
    frame.firstSeenAt = firstSeenAt;
    frame.isNew = (now - firstSeenAt) < NEW_WINDOW_MS;
  });

  // Forget wallpapers that no longer exist in the repo so this can't grow forever.
  Object.keys(map).forEach(filename=>{
    if(!seenFilenames.has(filename)) delete map[filename];
  });

  writeFirstSeenMap(map);
  return frames;
}

/*
 * Separate, filename-keyed cache just for sampled colors. Kept independent
 * of the wallpaper manifest cache above because the GitHub refresh path
 * often rebuilds fresh frame objects — this way a previously-seen
 * wallpaper's color survives that rebuild and never needs to be re-sampled.
 */
const COLOR_CACHE_KEY = 'blapples-wallpaper-colors-v6-matugen-stable';

function readColorCache(){
  try{
    const raw = localStorage.getItem(COLOR_CACHE_KEY);
    if(!raw) return {};
    const data = JSON.parse(raw);
    return (data && typeof data === 'object') ? data : {};
  }catch(err){
    console.warn('Color cache could not be read:', err);
    return {};
  }
}

function writeColorCache(map){
  try{
    localStorage.setItem(COLOR_CACHE_KEY, JSON.stringify(map));
  }catch(err){
    // Storage can be unavailable in private/file contexts; colors just
    // get re-sampled next visit instead of restoring instantly.
    console.warn('Color cache could not be written:', err);
  }
}

function updateChipStates(){

    const active = key==='all' ? activeColor===null : activeColor===key;

function setCardFilterVisible(card, visible){
  if(visible){
    if(!card.hidden) return;
    card.hidden = false;
    card.classList.add('filter-hidden');
    void card.offsetWidth; // force reflow so the fade-in transition runs
    requestAnimationFrame(()=> card.classList.remove('filter-hidden'));
  }else{

    card.classList.add('filter-hidden');

    }, 220);

function cardMatchesColorFilter(card){
  const frame=frameData[card.dataset.id];

/* ---------- Lazy-load card images near the viewport ---------- */
const CARD_PRELOAD_MARGIN = '700px 0px';

const cardImageLoader = ('IntersectionObserver' in window)
  ? new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting) return;

        const img = entry.target;
        const src = img.dataset.lazySrc;
        if(src && !img.dataset.lazyLoaded){
          img.src = src;
          img.dataset.lazyLoaded = 'true';

          // Let the browser decode before revealing the image.
          if(img.decode){
            img.decode().catch(()=>{}).finally(()=>{
              img.removeAttribute('data-lazy-src');
            });
          }else{
            img.removeAttribute('data-lazy-src');
          }
        }

        cardImageLoader.unobserve(img);
      });
    }, {
      root:null,
      rootMargin:CARD_PRELOAD_MARGIN,
      threshold:0.01
    })
  : null;

function prepareCardImage(img){
  if(!img) return;

  // Don't interfere with images that are already loaded.
  if(img.dataset.lazyPrepared === 'true') return;
  img.dataset.lazyPrepared = 'true';

  const src = img.getAttribute('src');
  if(!src) return;

  img.dataset.lazySrc = src;
  img.removeAttribute('src');
  img.setAttribute('loading','lazy');
  img.setAttribute('decoding','async');

  if(cardImageLoader){
    cardImageLoader.observe(img);
  }else{
    img.src = img.dataset.lazySrc;
    img.dataset.lazyLoaded = 'true';
  }
}

function prepareCardImages(root=document){
  root.querySelectorAll?.('.card img').forEach(prepareCardImage);
}

/* Reveal cards as they enter the viewport. */
const cardRevealObserver = ('IntersectionObserver' in window)
  ? new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add('is-visible');
          cardRevealObserver.unobserve(entry.target);
        }
      });
    }, {
      root:null,
      rootMargin:'0px 0px -8% 0px',
      threshold:0.08
    })
  : null;

function observeCardReveal(card){
  if(!card) return;
  if(cardRevealObserver){
    cardRevealObserver.observe(card);
  }else{
    card.classList.add('is-visible');
  }
}

function observeAllCardReveals(){
  grid.querySelectorAll('.card').forEach(observeCardReveal);
}

function applyColorFilter(){
  grid.querySelectorAll('.card').forEach(applyColorFilterToCard);
  observeAllCardReveals();
  prepareCardImages(grid);
}

/* Automatically pick up cards added by the wallpaper renderer/cache. */
if('MutationObserver' in window){
  const cardMutationObserver = new MutationObserver((mutations)=>{
    mutations.forEach(mutation=>{
      mutation.addedNodes.forEach(node=>{
        if(node.nodeType !== 1) return;
        if(node.classList?.contains('card')){
          observeCardReveal(node);
          prepareCardImages(node);
        }
        node.querySelectorAll?.('.card').forEach(card=>{
          observeCardReveal(card);
          prepareCardImages(card);
        });
      });
    });
  });
  cardMutationObserver.observe(grid, {childList:true, subtree:true});
}

function setActiveColor(key){
  // Selecting a color replaces the previous selection.
  // Clicking the currently selected color does nothing; use "All colors" to clear it.
  activeColor = key==='all' ? null : key;
  applyColorTheme(activeColor);
  updateChipStates();
  applyColorFilter();

  // Keep filter changes consistent and responsive by returning the user to the top.
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function ensureColorChip(colorKey){
  if(colorChipEls.has(colorKey)) return colorChipEls.get(colorKey);
  const meta = COLOR_BUCKETS.find(b=>b.key===colorKey);
  if(!meta) return null;

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'color-chip';
  btn.dataset.color = colorKey;
  btn.setAttribute('aria-pressed','false');
  btn.innerHTML =
    `<span class="color-chip-swatch" style="background:${meta.swatch}" aria-hidden="true"></span>${meta.label}<span class="color-chip-count"></span>`;
  btn.addEventListener('click', ()=> setActiveColor(colorKey));
  colorChipEls.set(colorKey, btn);

  // Not inserted into the DOM yet. Chips stay off-track (but keep
  // accumulating counts via registerColorForFrame) while the shimmer
  // placeholders are showing; revealColorChips() adds the whole
  // discovered set at once, in a fixed rainbow order.
  return btn;
}

function registerColorForFrame(frame){
  if(!COLOR_CLASS_PALETTE.some(c=>c.key===frame.colorKey)) return;
  const key=frame.colorKey;
  colorCounts.set(key,(colorCounts.get(key)||0)+1);
  const chip=ensureColorChip(key);
  const countEl=chip?.querySelector('.color-chip-count');
  if(countEl) countEl.textContent=`· ${colorCounts.get(key)}`;
  if(frame._card) applyColorFilterToCard(frame._card);
}

// Shimmer placeholders shown in the track while colors are still being
// sampled, reusing the same shimmer keyframes as the wallpaper skeletons.
const COLOR_SKELETON_WIDTHS = [76, 96, 64, 88];

function renderColorChipSkeletons(){
  COLOR_SKELETON_WIDTHS.forEach(width=>{
    const sk = document.createElement('span');
    sk.className = 'color-chip-skeleton';
    sk.style.width = width + 'px';
    sk.setAttribute('aria-hidden','true');
    colorFilterTrack.appendChild(sk);
  });
}

function clearColorChipSkeletons(){
  colorFilterTrack.querySelectorAll('.color-chip-skeleton').forEach(el=>el.remove());
}

// Swaps the shimmer placeholders for every color that was actually
// discovered, inserted together in a fixed rainbow order and given a
// short stagger so the reveal reads as one deliberate motion.
function revealColorChips(){
  clearColorChipSkeletons();
  colorFilterTrack.removeAttribute('aria-busy');
  let i = 0;
  COLOR_BUCKETS.forEach(({key})=>{
    const btn = colorChipEls.get(key);
    if(!btn) return;
    colorFilterTrack.appendChild(btn);
    const delay = Math.min(i, 6) * 40;
    i++;
    window.setTimeout(()=>{
      requestAnimationFrame(()=> btn.classList.add('chip-in'));
    }, delay);
  });
}

function resetColorFilterUI(total){
  colorChipEls.forEach((el,key)=>{ if(key!=='all') el.remove(); });
  colorChipEls.clear();
  colorChipEls.set('all', colorFilterAllBtn);
  colorCounts.clear();
  activeColor = null;
  applyColorTheme(null);
  clearColorChipSkeletons();
  colorFilterAllCount.textContent = total ? `· ${total}` : '';
  if(total > 0){
    renderColorChipSkeletons();
    colorFilterTrack.setAttribute('aria-busy','true');
  }else{
    colorFilterTrack.removeAttribute('aria-busy');
  }
  updateChipStates();
}

async function computeAllFrameColors(frames, generation){
  const cache=readColorCache();
  const CONCURRENCY=6;
  let idx=0, cacheDirty=false;
  async function worker(){
    while(idx<frames.length){
      if(generation!==renderGeneration) return;
      const frame=frames[idx++];
      if(!frame) continue;
      const cached=frame.filename && cache[frame.filename];
      const valid=cached && COLOR_CLASS_PALETTE.some(c=>c.key===cached.key) &&
        Number.isFinite(cached.r)&&Number.isFinite(cached.g)&&Number.isFinite(cached.b);
      let result=valid?cached:await computeFrameColor(frame);
      if(generation!==renderGeneration) return;
      if(!result) result={r:128,g:128,b:128,key:'blue'};
      frame.colorKey=result.key;
      frame.colorSample=`rgb(${result.r},${result.g},${result.b})`;
      registerColorForFrame(frame);
      if(frame.filename && !valid){ cache[frame.filename]=result; cacheDirty=true; }
    }
  }
  await Promise.all(Array.from({length:Math.min(CONCURRENCY,Math.max(1,frames.length))},worker));
  if(generation!==renderGeneration) return;
  if(cacheDirty) writeColorCache(cache);
  revealColorChips();
  // If cards have already been created, immediately apply any active filter.
  applyColorFilter();
}
let renderGeneration = 0;

/* ---------- New Wallpapers section ----------
 * A second, smaller set of cards for whichever wallpapers trackNewWallpapers
 * marked isNew. These are separate DOM elements from the main grid's cards
 * (the simplest way to show the same wallpaper in two places), but clicking
 * one opens the exact same lightbox/pool as the main grid, keyed off the
 * shared frame.frameNo id - so prev/next still walks the full collection.
 */
const newSection = document.getElementById('newSection');
const newGrid = document.getElementById('newGrid');

function buildNewBadge(){
  const badge = document.createElement('span');
  badge.className = 'new-badge';
  badge.textContent = 'New';
  badge.setAttribute('aria-hidden', 'true');
  return badge;
}

function buildNewSectionCard(frame){
  const card = document.createElement('button');
  card.className = 'card new-card';
  card.dataset.id = frame.frameNo;
  card.setAttribute('aria-label', `Open ${frame.title} (added this week)`);

  const img = document.createElement('img');
  img.alt = frame.title;
  img.src = frame.previewSrc || makePreviewUrl(frame.src, CARD_PREVIEW_WIDTH);
  prepareCardImage(img);

  card.append(img, buildNewBadge());
  card.addEventListener('click', ()=> openLightbox(frame.frameNo));
  observeCardReveal(card);
  return card;
}

function renderNewSection(frames){
  if(!newSection || !newGrid) return;
  const newFrames = frames.filter(frame => frame.isNew);

  newGrid.innerHTML = '';
  if(!newFrames.length){
    newSection.hidden = true;
    return;
  }

  newSection.hidden = false;
  const frag = document.createDocumentFragment();
  newFrames.forEach(frame => frag.appendChild(buildNewSectionCard(frame)));
  newGrid.appendChild(frag);
}

function renderFrames(frames, usingPlaceholders=false, isAuthoritative=true){
  // Invalidate any chunked render that is still scheduled from a previous
  // manifest. Without this, a background GitHub refresh could race the
  // cached render and leave a partially mixed gallery.
  renderGeneration++;
  const generation = renderGeneration;

  // Placeholder/demo art doesn't have real filenames yet at this point
  // (buildCard assigns them per-card), so there's nothing to track.
  if(!usingPlaceholders) trackNewWallpapers(frames, isAuthoritative);

  grid.innerHTML = '';
  Object.keys(frameData).forEach(key => delete frameData[key]);
  buildCardsChunked(frames, usingPlaceholders, IS_MOBILE_DEVICE ? 6 : 12, generation);

  renderNewSection(usingPlaceholders ? [] : frames);

  // Reset the color filter chips for this manifest, then classify every
  // wallpaper's dominant color in the background (decoupled from lazy card
  // loading above, so filtering stays accurate even before scrolling).
  resetColorFilterUI(frames.length);
  computeAllFrameColors(frames, generation);

  if(frames[0]?.src){
    const ambientSrc = frames[0].previewSrc || makePreviewUrl(frames[0].src, CARD_PREVIEW_WIDTH);
    document.getElementById('ambientBg').style.backgroundImage =
      `url("${ambientSrc}")`;
  }
}


const revealObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('visible');
      revealObserver.unobserve(entry.target);
    }
  });
}, { rootMargin:'120px 0px', threshold:0.05 });

function renderSkeletons(count){
  const frag = document.createDocumentFragment();
  for(let i=0;i<count;i++){
    const sk = document.createElement('div');
    sk.className = 'skeleton';
    frag.appendChild(sk);
  }
  grid.appendChild(frag);
}

function buildCard(frame, idx, usingPlaceholders){
  if(usingPlaceholders){
    const canvas = document.createElement('canvas');
    canvas.width=W; canvas.height=H;
    const ctx = canvas.getContext('2d');
    paintWallpaper(ctx, W, H, frame.family);
    frame.src = canvas.toDataURL('image/png');
    frame.previewSrc = frame.src;
    frame.lightboxSrc = frame.src;
    frame.filename = `${slugify(frame.title)}-${pad(frame.frameNo)}.png`;
  }
  frameData[frame.frameNo] = frame;

  const card = document.createElement('button');
  card.className = 'card';
  card.dataset.id = frame.frameNo;
  card.setAttribute('aria-label', frame.isNew ? `Open ${frame.title} (added this week)` : `Open ${frame.title}`);

  const img = document.createElement('img');
  img.alt = frame.title;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.fetchPriority = idx < (IS_MOBILE_DEVICE ? 2 : 4) ? 'high' : 'low';

  // Attach the listener BEFORE assigning src. This is important because
  // cached images can finish loading immediately.
  frame._img = img;

  img.addEventListener('load', ()=>{
    frame.width = img.naturalWidth;
    frame.height = img.naturalHeight;

  }, { once:true });

  // Use only the resized preview for the gallery. The original `frame.src`
  // is intentionally never assigned to the card image.
  img.src = frame.previewSrc || makePreviewUrl(frame.src, CARD_PREVIEW_WIDTH);

  if(img.complete && img.naturalWidth){
    frame.width = img.naturalWidth;
    frame.height = img.naturalHeight;
    // These helpers existed in an earlier filter version of the gallery.
    // Guard them so an already-cached image can never abort card creation
    // during a browser refresh.
    if(typeof resolutionKey === 'function'){
      frame.resolution = resolutionKey(img.naturalWidth, img.naturalHeight);
    }
    if(typeof rebuildResolutionFilters === 'function'){
      rebuildResolutionFilters();
    }
  }

  const overlay = document.createElement('div');
  overlay.className = 'card-overlay';
  const titleEl = document.createElement('div');
  titleEl.className = 'card-title';
  titleEl.textContent = frame.title;
  overlay.appendChild(titleEl);

  card.append(img, overlay);
  if(frame.isNew) card.appendChild(buildNewBadge());
  card.addEventListener('click', ()=> openLightbox(frame.frameNo));
  grid.appendChild(card);
  frame._card=card;
  // Chunked rendering can continue after a filter is selected, so every new
  // card must be filtered immediately instead of waiting for a second click.
  applyColorFilterToCard(card);
  revealObserver.observe(card);
}

function buildCardsChunked(frames, usingPlaceholders, chunkSize=12, generation=renderGeneration){
  let i = 0;
  function step(){
    // Stop immediately if another render has replaced this manifest.
    if(generation !== renderGeneration) return;
    const end = Math.min(i + chunkSize, frames.length);
    for(; i < end; i++){
      if(generation !== renderGeneration) return;
      buildCard(frames[i], i, usingPlaceholders);
    }
    if(i < frames.length) requestAnimationFrame(step);
  }
  step();
}

renderSkeletons(12);

async function init(){
  // Render the last known wallpaper list immediately. This makes refreshes
  // reliable even when the GitHub API is temporarily unavailable.
  const cachedFrames = readWallpaperCache();

  if(cachedFrames?.length){
    // Non-authoritative: the cache can be stale or incomplete, so this
    // pass only reads existing "first seen" data, it never decides what's new.
    renderFrames(cachedFrames, false, false);
  }

  // Always try to refresh the manifest in the background so newly added
  // wallpapers still appear without requiring the user to reopen the file.
  try{
    const freshFrames = await fetchWallpapersFromGitHub(GITHUB_SOURCE);
    if(!freshFrames.length) throw new Error('No images found in that repo/path');

    // Never replace a known-good manifest with a transiently incomplete
    // API response. Match wallpapers by filename so ordering/indices cannot
    // make one card disappear between refreshes.
    const known = cachedFrames || [];
    const freshByFile = new Map(freshFrames.map(frame => [frame.filename, frame]));

    // A successful GitHub listing is authoritative.
    // If wallpapers were deleted from the repository, they should disappear
    // from the gallery instead of being restored from the local cache.
    // The cache is still used above for instant startup and remains a fallback
    // only when the GitHub refresh itself fails.
    let finalFrames = freshFrames;

    // Re-number after the authoritative refresh so frame IDs are always
    // unique and stable for the current render.
    finalFrames = finalFrames.map((frame, index) => ({...frame, frameNo:index + 1}));
    writeWallpaperCache(finalFrames);
    // Authoritative: this is the live GitHub listing, so it's the one
    // allowed to stamp genuinely new filenames with today's date.
    renderFrames(finalFrames, false, true);
  }catch(err){
    console.warn('Could not refresh wallpapers from GitHub:', err.message);

    // If there is no cache yet, use the built-in placeholders instead of
    // leaving the gallery empty.
    if(!cachedFrames?.length){
      const fallbackFrames = buildPlaceholderFrames();
      renderFrames(fallbackFrames, true);
    }
  }

  // Keep the custom collection subtitle.
  document.getElementById('subtitle').textContent = 'maomao 😾';
}
init();

/* ---------- Lightbox ---------- */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbStatus = document.getElementById('lbStatus');
const lbTitle = document.getElementById('lbTitle');
const lbCount = document.getElementById('lbCount');
const lbDownload = document.getElementById('lbDownload');
let currentIndex = -1;

function getPool(){
  // The lightbox should follow the currently visible/filtered gallery,
  // not the full wallpaper manifest. Color filtering marks excluded
  // cards with .filter-hidden instead of removing them from the DOM.
  return Array.from(grid.querySelectorAll('.card'))
    .filter(card => !card.classList.contains('filter-hidden') && !card.hidden);
}

function openLightbox(id){
  const pool = getPool();
  if(!pool.length) return;
  const found = pool.findIndex(el=>el.dataset.id === String(id));
  currentIndex = found===-1 ? 0 : found;
  lightbox.hidden = false;
  document.body.style.overflow = 'hidden';
  renderLightbox(pool);
}
function renderLightbox(pool){
  const el = pool[currentIndex];
  const frame = frameData[el.dataset.id];

  lbImg.loading = 'eager';
  lbImg.decoding = 'async';
  lbImg.classList.remove('loaded');
  lbStatus.hidden = false;
  lbStatus.classList.remove('error');
  lbStatus.textContent = 'Loading…';
  lbImg.onload = ()=>{ lbImg.classList.add('loaded'); lbStatus.hidden = true; };
  lbImg.onerror = ()=>{
    lbStatus.classList.add('error');
    lbStatus.textContent = "Couldn't load this image — try Download instead, or open it directly on GitHub.";
  };
  // The lightbox gets a larger optimized preview, not the original.
  // This keeps large 4K/8K wallpapers fast to open while preserving the
  // original URL for the Download button.
  lbImg.src = frame.lightboxSrc || makePreviewUrl(frame.src, LIGHTBOX_PREVIEW_WIDTH);
  lbImg.alt = frame.title;

  lbTitle.textContent = frame.title;
  lbCount.textContent = `${currentIndex+1} / ${pool.length}`;
  lbDownload.onclick = ()=> downloadFrame(frame);
}
function closeLightbox(){
  lightbox.hidden = true;
  document.body.style.overflow = '';
}
function stepLightbox(delta){
  const pool = getPool();
  if(!pool.length) return;
  currentIndex = (currentIndex + delta + pool.length) % pool.length;
  renderLightbox(pool);
}
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', ()=>stepLightbox(-1));
document.getElementById('lbNext').addEventListener('click', ()=>stepLightbox(1));
lightbox.addEventListener('click', e=>{ if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e=>{
  if(lightbox.hidden) return;
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') stepLightbox(-1);
  if(e.key==='ArrowRight') stepLightbox(1);
});

/* ---------- Download ---------- */
async function downloadFrame(frame){
  try{
    let href = frame.src;
    if(!href.startsWith('data:') && !href.startsWith('blob:')){
      const res = await fetch(href, { mode:'cors' });
      const blob = await res.blob();
      href = URL.createObjectURL(blob);
    }
    const a = document.createElement('a');
    a.href = href;
    a.download = frame.filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(err){
    window.open(frame.src, '_blank');
  }
}

/* ---------- Responsive header behavior ---------- */
const topbar = document.querySelector('.topbar');
const headerPlaceholder = document.getElementById('headerPlaceholder');
const mobileTopBtn = document.getElementById('mobileTopBtn');
const colorFilter = document.getElementById('colorFilter');
const colorFilterHome = colorFilter.parentNode;
const mobileLayout = window.matchMedia('(max-width: 640px)');
let lastScrollY = window.scrollY;
let headerTicking = false;

function moveFilterIntoHeader(){
  if(colorFilter.parentNode !== topbar) topbar.appendChild(colorFilter);
}
function moveFilterBack(){
  if(colorFilter.parentNode !== colorFilterHome){
    colorFilterHome.insertBefore(colorFilter, document.getElementById('grid'));
  }
}

function updateHeaderOnScroll(){
  const y = window.scrollY;
  const delta = y - lastScrollY;
  const isMobile = mobileLayout.matches;

  if(isMobile){
    // Exact mobile behavior from blapples-wallpaper-collection-scroll-header(1).
    moveFilterBack();
    topbar.classList.remove('is-compact');
    if(y > 180 && delta > 0){
      topbar.classList.add('is-mobile-hidden');
      mobileTopBtn.classList.add('visible');
    }else if(delta < 0 && y < 80){
      topbar.classList.remove('is-mobile-hidden');
      mobileTopBtn.classList.remove('visible');
    }else if(delta < 0){
      mobileTopBtn.classList.add('visible');
    }
  }else{
    // Exact desktop compact-header behavior from the reference file.
    const compactThreshold = 90;
    if(y > compactThreshold){
      if(!topbar.classList.contains('is-compact')){
        const rect = topbar.getBoundingClientRect();
        headerPlaceholder.style.height = `${rect.height + 46}px`;
        headerPlaceholder.style.display = 'block';
      }
      moveFilterIntoHeader();
      topbar.classList.add('is-compact');
    }else{
      topbar.classList.remove('is-compact');
      moveFilterBack();
      headerPlaceholder.style.display = 'none';
      headerPlaceholder.style.height = '0px';
    }
  }

  lastScrollY = y;
  headerTicking = false;
}

window.addEventListener('scroll', ()=>{
  if(!headerTicking){
    headerTicking = true;
    requestAnimationFrame(updateHeaderOnScroll);
  }
},{passive:true});

window.addEventListener('resize', ()=>{
  if(mobileLayout.matches) moveFilterBack();
  else if(window.scrollY > 90) moveFilterIntoHeader();
},{passive:true});

mobileTopBtn.addEventListener('click', ()=>{
  window.scrollTo({top:0,behavior:'smooth'});
  topbar.classList.remove('is-mobile-hidden');
  mobileTopBtn.classList.remove('visible');
});

/* Mobile compact color-filter dock */
const mobileColorDock = document.getElementById('mobileColorDock');
const mobileColorDots = document.getElementById('mobileColorDots');

function buildMobileColorDots(){
  if(!mobileColorDots || typeof COLOR_BUCKETS === 'undefined') return;

  mobileColorDots.innerHTML = '';

  const all = document.createElement('button');
  all.type = 'button';
  all.className = 'mobile-color-dot';
  all.dataset.color = 'all';
  all.title = 'All colors';
  all.setAttribute('aria-label','All colors');
  all.addEventListener('click',()=>setActiveColor('all'));
  mobileColorDots.appendChild(all);

  COLOR_BUCKETS.forEach(meta=>{
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'mobile-color-dot';
    dot.dataset.color = meta.key;
    dot.title = meta.label;
    dot.setAttribute('aria-label',meta.label);
    dot.style.background = meta.swatch;
    dot.addEventListener('click',()=>setActiveColor(meta.key));
    mobileColorDots.appendChild(dot);
  });

  updateMobileColorDots();
}

function updateMobileColorDots(){
  if(!mobileColorDots) return;
  mobileColorDots.querySelectorAll('.mobile-color-dot').forEach(dot=>{
    const active = dot.dataset.color === 'all'
      ? activeColor === null
      : dot.dataset.color === activeColor;
    dot.classList.toggle('is-active',active);
    dot.setAttribute('aria-pressed',String(active));
  });
}

const mobileColorOriginalSetActiveColor = setActiveColor;
setActiveColor = function(key){
  mobileColorOriginalSetActiveColor(key);
  updateMobileColorDots();
};

buildMobileColorDots();

let mobileColorDockTicking = false;
window.addEventListener('scroll',()=>{
  if(mobileColorDockTicking) return;
  mobileColorDockTicking = true;

  requestAnimationFrame(()=>{
    if(mobileLayout.matches){
      document.body.classList.toggle('mobile-color-dock-visible',window.scrollY > 180);
    }else{
      document.body.classList.remove('mobile-color-dock-visible');
    }
    mobileColorDockTicking = false;
  });
},{passive:true});

window.addEventListener('resize',()=>{
  if(!mobileLayout.matches){
    document.body.classList.remove('mobile-color-dock-visible');
  }
},{passive:true});

updateHeaderOnScroll();
</script>

<script>
  (() => {
    const intro = document.getElementById('siteIntro');
    if(!intro) return;

    const finishIntro = () => {
      intro.classList.add('is-leaving');
      setTimeout(() => intro.remove(), 750);
    };

    // Keep the opening short, but give the logo animation time to land.
    window.addEventListener('load', () => setTimeout(finishIntro, 900), {once:true});

    // Never leave the user staring at the intro if a network request is slow.
    setTimeout(finishIntro, 3200);
  })();
</script>
