<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Material Expressive-inspired olive / sage palette from the reference */
    --md-primary:#c7d39a;
    --md-on-primary:#171a12;
    --md-primary-container:#4f5b36;
    --md-on-primary-container:#e4e9d2;

    --md-secondary:#8f9d70;
    --md-on-secondary:#151811;
    --md-secondary-container:#303722;
    --md-on-secondary-container:#dce4c2;

    --md-tertiary:#aeb982;
    --md-on-tertiary:#181b13;

    --md-surface:#11130f;
    --md-surface-container-low:rgba(22,25,18,.82);
    --md-surface-container:rgba(27,31,22,.88);
    --md-surface-container-high:rgba(35,40,27,.92);
    --md-surface-container-highest:rgba(45,51,33,.95);
    --md-on-surface:#eef1e4;
    --md-on-surface-variant:#aeb69a;
    --md-outline:rgba(190,205,151,.24);

    /* Dynamic color-filter atmosphere. These stay on the current sage theme
       until a specific color filter is selected. */
    --theme-glow-1:rgba(150,170,105,.14);
    --theme-glow-2:rgba(115,140,76,.12);
    --theme-bg-1:#0b0d0a;
    --theme-bg-2:#151912;
    --theme-bg-3:#090b08;
    --theme-header-bg:rgba(18,21,15,.90);
    --theme-header-border:rgba(190,205,151,.12);
    --theme-scrim-top:rgba(8,10,7,.60);
    --theme-scrim-bottom:rgba(9,12,8,.82);

    --shape-xs:10px;
    --shape-sm:18px;
    --shape-md:24px;
    --shape-lg:28px;
    --shape-xl:28px;
    --shape-expressive:28px;
    --shape-full:999px;

    --elev-1:0 2px 10px rgba(18,22,13,.18);
    --elev-2:0 8px 28px rgba(18,22,13,.24);
    --elev-3:0 18px 50px rgba(10,13,8,.34);

    --spring:cubic-bezier(.22,1.35,.36,1);
    --standard:cubic-bezier(.2,0,0,1);
    --font:'Roboto Flex',Roboto,system-ui,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}

  /* Kill the browser's own default press feedback everywhere - the blue/
     grey flash Android shows on tap, and the blue selection-ish highlight
     iOS shows on a press-and-hold (also suppresses its "Open/Copy/Share"
     long-press callout bubble). The app already has its own deliberate
     press/ripple treatment on buttons and cards, so this is purely
     removing the redundant native one underneath it, everywhere at once. */
  *{
    -webkit-tap-highlight-color:transparent;
    tap-highlight-color:transparent;
  }
  button,a,.card,img{
    -webkit-touch-callout:none;
  }

  body{
    min-height:100vh;
    color:var(--md-on-surface);
    font-family:var(--font);
    font-optical-sizing:auto;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(circle at 18% 15%,var(--theme-glow-1),transparent 30%),
      radial-gradient(circle at 85% 30%,var(--theme-glow-2),transparent 32%),
      linear-gradient(145deg,var(--theme-bg-1),var(--theme-bg-2) 48%,var(--theme-bg-3));
    overflow-x:hidden;
    transition:background .65s ease,color .35s ease;
  }

  /* Ambient wallpaper behind the whole interface */
  .ambient-bg{
    position:fixed;
    inset:-6%;
    z-index:-3;
    background-position:center;
    background-size:cover;
    opacity:.40;
    filter:blur(34px) saturate(.72);
    transform:scale(1.08);
    transition:background-image .8s ease,opacity .5s ease;
  }
  .ambient-scrim{
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;
    background:
      linear-gradient(180deg,var(--theme-scrim-top),var(--theme-scrim-bottom)),
      radial-gradient(circle at 50% 20%,transparent 0 25%,rgba(5,7,5,.42) 100%);
  }

  button{font:inherit;color:inherit;border:0;background:none}

  .topbar{
    position:relative;
    top:auto;
    z-index:30;
    width:min(1440px,calc(100% - 36px));
    margin:18px auto 28px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    background:var(--theme-header-bg);
    border:1px solid var(--theme-header-border);
    border-radius:var(--shape-lg);
    box-shadow:var(--elev-2);
    backdrop-filter:blur(24px) saturate(1.12);
    -webkit-backdrop-filter:blur(24px) saturate(1.12);
    transition:padding .24s cubic-bezier(.22,1.35,.36,1),width .24s cubic-bezier(.22,1.35,.36,1),border-radius .24s ease,box-shadow .24s ease;
  }

  .header-placeholder{
    display:none;
    width:100%;
    pointer-events:none;
  }

  .mobile-top-btn{
    display:none;
  }

  .topbar.is-compact{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:min(1120px,calc(100% - 36px));
    margin:0;
    padding:10px 14px;
    border-radius:22px;
    z-index:30;
    box-shadow:var(--elev-3);
  }

  .topbar.is-compact .brand{gap:10px}
  .topbar.is-compact .brand-mark{width:38px;height:38px;border-radius:16px}
  .topbar.is-compact .brand-mark svg{width:19px;height:19px}
  .topbar.is-compact h1{font-size:20px}
  .topbar.is-compact .subtitle,.topbar.is-compact .eyebrow-chip{display:none}

  /* Compact desktop header: keep every filter visible without a horizontal scroller. */
  .topbar.is-compact{
    gap:12px;
  }
  .topbar.is-compact .brand{
    flex:0 0 auto;
    gap:10px;
  }
  .topbar.is-compact .brand-copy{
    width:190px;
  }
  .topbar.is-compact .color-filter{
    flex:1 1 0;
    width:auto;
    min-width:0;
    margin:0;
  }
  .topbar.is-compact .color-filter-track{
    width:100%;
    min-width:0;
    padding:0;
    gap:6px;
    overflow:visible;
    justify-content:space-between;
  }
  .topbar.is-compact .color-chip{
    flex:0 1 auto;
    min-width:0;
    padding:7px 9px 7px 7px;
    gap:6px;
    font-size:12px;
    box-shadow:none;
  }
  .topbar.is-compact .color-chip-swatch{
    width:22px;
    height:22px;
    flex:0 0 22px;
  }

  @media (min-width:641px) and (max-width:900px){
    .topbar.is-compact{
      width:calc(100% - 24px);
      padding:8px 10px;
      gap:8px;
    }
    .topbar.is-compact .brand-copy{width:145px;}
    .topbar.is-compact h1{font-size:17px;}
    .topbar.is-compact .brand-mark{width:34px;height:34px;}
    .topbar.is-compact .brand-mark svg{width:17px;height:17px;}
    .topbar.is-compact .color-filter-track{gap:3px;}
    .topbar.is-compact .color-chip{
      padding:6px 6px 6px 5px;
      gap:4px;
      font-size:10px;
    }
    .topbar.is-compact .color-chip-swatch{
      width:18px;
      height:18px;
      flex-basis:18px;
    }
  }

  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }

  .brand-mark{
    width:52px;
    height:52px;
    flex:0 0 auto;
    display:grid;
    place-items:center;
    border-radius:var(--shape-lg);
    background:var(--md-primary);
    color:var(--md-on-primary);
    box-shadow:0 5px 18px rgba(0,0,0,.18);
  }

  .brand-mark svg{width:25px;height:25px;display:block}

  .brand-copy{min-width:0}
  h1{
    margin:0;
    font-size:clamp(25px,3vw,36px);
    line-height:1;
    letter-spacing:-.035em;
    font-weight:700;
  }

  .subtitle{
    margin:6px 0 0;
    color:var(--md-on-surface-variant);
    font-size:13px;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:55vw;
  }

  .eyebrow-chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:10px 14px;
    border-radius:var(--shape-full);
    background:rgba(166,184,117,.10);
    color:var(--md-on-surface-variant);
    border:1px solid rgba(235,240,214,.12);
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .eyebrow-chip svg{width:14px;height:14px}

  /* Wraps the eyebrow chip and the sound/roast toggle buttons together so
     the pair keeps sitting on the right side of the header as one unit,
     the same spot the eyebrow chip occupied on its own before. */
  .topbar-end{
    display:flex;
    align-items:center;
    gap:12px;
    flex:0 0 auto;
  }
  .topbar-toggles{
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .topbar-toggles .icon-btn.is-active{
    background:var(--md-primary);
    color:var(--md-on-primary);
    border-color:transparent;
  }
  #soundToggleBtn .icon-sound-on{display:none}
  #soundToggleBtn.is-active .icon-sound-on{display:block}
  #soundToggleBtn.is-active .icon-sound-off{display:none}

  .topbar.is-compact .topbar-toggles .icon-btn{
    width:36px;
    height:36px;
  }
  .topbar.is-compact .topbar-toggles .icon-btn svg{
    width:16px;
    height:16px;
  }

  /* Color filter — Material Expressive filter-chip row for narrowing the
     gallery to wallpapers that share a dominant color. Colors are sampled
     client-side (see computeFrameColor) and bucketed into a fixed palette,
     so chips fade in one at a time as each wallpaper finishes classifying. */
  .color-filter{
    width:min(1440px,calc(100% - 36px));
    margin:0 auto 22px;
  }

  .color-filter-track{
    display:flex;
    align-items:center;
    gap:8px;
    padding:2px 4px 10px;
    overflow-x:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .color-filter-track::-webkit-scrollbar{display:none}

  .color-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
    padding:10px 16px 10px 10px;
    border-radius:var(--shape-full);
    background:var(--md-surface-container-low);
    border:1px solid var(--md-outline);
    color:var(--md-on-surface-variant);
    font-size:13px;
    font-weight:650;
    letter-spacing:.01em;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:var(--elev-1);
    opacity:0;
    transform:translateY(6px) scale(.94);
    transition:
      background .25s var(--standard),
      color .2s ease,
      border-color .25s var(--standard),
      box-shadow .25s var(--standard),
      transform .35s var(--spring),
      border-radius .35s var(--spring),
      opacity .3s ease;
  }
  .color-chip.chip-in{opacity:1;transform:none}

  .color-chip:hover{
    transform:translateY(-2px);
    box-shadow:var(--elev-2);
    border-color:rgba(236,241,211,.28);
  }
  .color-chip.chip-in:active{transform:scale(.95)}

  .color-chip-swatch{
    width:18px;
    height:18px;
    border-radius:50%;
    flex:0 0 auto;
    border:1px solid rgba(255,255,255,.35);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);
  }
  .color-chip-swatch--all{
    background:conic-gradient(from 180deg,#e0483e,#e08a3e,#e0c93e,#6cbf5c,#4c7fe0,#8a5ce0,#e0483e);
  }

  .color-chip-count{
    color:var(--md-on-surface-variant);
    font-weight:700;
    opacity:.6;
    font-size:11px;
    margin-left:-2px;
  }

  .color-chip.is-active{
    background:var(--md-primary);
    color:var(--md-on-primary);
    border-color:transparent;
    box-shadow:var(--elev-2);
  }
  .color-chip.is-active .color-chip-count{color:var(--md-on-primary);opacity:.65}
  .color-chip.is-active .color-chip-swatch{
    border-color:rgba(23,26,18,.4);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),0 0 0 3px rgba(23,26,18,.14);
  }

  /* Shown in the track while colors are still being sampled; reuses the
     same shimmer keyframes as the wallpaper card skeletons below. */
  .color-chip-skeleton{
    flex:0 0 auto;
    height:38px;
    border-radius:var(--shape-full);
    background:linear-gradient(
      110deg,
      rgba(17,20,14,.78) 30%,
      rgba(58,70,38,.55) 50%,
      rgba(17,20,14,.78) 70%
    );
    background-size:200% 100%;
    animation:shimmer 1.6s ease-in-out infinite;
  }

  /* Cards hidden/shown by the color filter fade and settle instead of
     popping instantly, echoing the spring used for the initial card reveal. */
  .grid .card.filter-hidden{
    opacity:0;
    transform:scale(.94) translateY(8px);
    pointer-events:none;
    transition:opacity .22s var(--standard),transform .22s var(--standard);
  }

  .grid{
    width:min(1440px,calc(100% - 36px));
    margin:0 auto;
    padding:0 0 150px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
    gap:18px;
    align-items:start;
  }

  /*
    The reference uses wallpapers as visual surfaces rather than cropped
    square thumbnails. Cards therefore keep the entire image visible.
  */
  .card{
    position:relative;
    width:100%;
    aspect-ratio:16 / 9;
    height:auto;
    min-height:0;
    overflow:hidden;
    cursor:pointer;
    padding:0;
    border-radius:var(--shape-lg);
    background:rgba(45,50,35,.72);
    border:1px solid rgba(241,245,218,.12);
    box-shadow:var(--elev-1);
    isolation:isolate;
    opacity:0;
    transform:translateY(18px) scale(.97);
    filter:saturate(.88);
    transition:
      opacity .6s var(--spring),
      transform .6s var(--spring),
      filter .5s ease,
      box-shadow .35s var(--standard),
      border-radius .4s var(--spring);
    content-visibility:auto;
    contain-intrinsic-size:320px 340px;
  }
  .card.visible{opacity:1;transform:none;filter:saturate(1)}

  /* Staggered pop-in: a handful of cards springing in slightly out of sync
     reads as far more alive than every card arriving in perfect lockstep. */
  .card:nth-child(3n+1){transition-delay:0ms}
  .card:nth-child(3n+2){transition-delay:45ms}
  .card:nth-child(3n){transition-delay:90ms}

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:linear-gradient(
      180deg,
      rgba(255,255,255,.035),
      transparent 26%,
      transparent 62%,
      rgba(20,24,14,.48)
    );
  }

  /* Expressive shape-morph: corners flex asymmetrically on hover, then flex
     the opposite way on press, like a squeezed squircle, instead of a flat
     uniform radius change. */
  .card:hover,.card:focus-visible{
    box-shadow:var(--elev-3);
    transform:translateY(-6px) scale(1.012);
    border-color:rgba(236,241,211,.24);
    border-radius:36px 14px 36px 14px;
    z-index:2;
    will-change:transform,box-shadow;
  }
  .card:active{
    border-radius:14px 36px 14px 36px;
  }

  @media (prefers-reduced-motion: reduce){
    .card{
      opacity:1;
      transform:none;
      filter:none;
      transition:box-shadow .2s ease;
    }
    .card:hover,.card:focus-visible,.card:active{
      border-radius:var(--shape-lg);
      transform:none;
    }
  }

  .card:focus-visible{
    outline:2px solid var(--md-primary);
    outline-offset:3px;
  }

  .card img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    background:
      radial-gradient(circle at 50% 35%,rgba(177,190,140,.20),transparent 55%),
      rgba(8,10,7,.92);
    transition:transform .7s var(--standard),filter .5s ease;
  }

  .card:hover img{
    transform:scale(.995);
    filter:saturate(1.04);
  }

  /* Wallpaper names are hidden on the cards to keep the gallery compact.
     The name is still shown in the lightbox after clicking a wallpaper —
     except in Roast Me mode, see body.roast-mode above, where a caption
     is deliberately surfaced here on the card itself. */
  .card-overlay{
    display:none;
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
  }

  .card-title{
    font-size:15px;
    font-weight:650;
    letter-spacing:-.01em;
    color:var(--md-on-surface);
  }

  /* ---------- "New" badge + New Wallpapers section ----------
     A wallpaper counts as new for 7 days after this browser first notices
     it (tracked client-side — see trackNewWallpapers in the script). The
     badge shows on the card wherever it appears; the dedicated section
     further down is just a shortcut to the same "new" wallpapers. */
  .new-badge{
    position:absolute;
    top:10px;
    left:10px;
    z-index:3;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 11px 5px 9px;

/*
 * Images are only assigned their real source when they are close to the

 * entire collection at once.
 */
.card img{
  content-visibility:auto;
}

     Default dialog size stays a comfortable centered modal. Toggling

  .dialog.is-maximized{

    place-items:center;

      radial-gradient(circle at 50% 40%,
        color-mix(in srgb,var(--md-primary) 15%,transparent),

    transition:background .5s ease,border-color .5s ease;
  }

  .dialog-media::before{
    content:"";

    background:
      radial-gradient(circle at 50% 40%,
        color-mix(in srgb,var(--md-primary) 14%,transparent),
        transparent 55%);
    filter:blur(18px);

  /* ---------- Hero carousel (Material 3 "carousel" style) ----------
     A horizontal strip of every wallpaper in the pool. The active tile is
     shown at full size, uncropped, so nothing about the selected wallpaper
     is cut off; every other tile is cropped to fill a shrinking "peek" card
     based on its distance from the active one. How many peeks are visible
     just falls out of how much width is left over — no fixed peek count.
     The track is re-centered on the active item, but clamped so it can
     never leave a gap: at the very first wallpaper the active tile sits
     flush against the left edge (nothing to balance it on that side), and
     at the very last wallpaper it sits flush against the right edge — the
     mirror image of the start. Width and position both animate on a plain,
     smooth glide — a single, calm slide of the whole strip, the same way it
     already feels while dragging — rather than any bounce or per-tile pop. */
  .wp-carousel{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    display:flex;
    align-items:center;
    touch-action:pan-y;
    cursor:grab;
  }
  .wp-carousel.is-dragging{cursor:grabbing}
  .wp-track{
    display:flex;
    align-items:center;
    height:100%;
    will-change:transform;
    transition:transform .38s cubic-bezier(.16,1,.3,1);
  }
  .wp-track.is-dragging{transition:none}
  .wp-item{
    position:relative;
    flex:0 0 auto;
    height:100%;
    margin:0 5px;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    contain:layout paint style;
    background:color-mix(in srgb,var(--md-primary-container) 30%,#0a0c08 70%);
    box-shadow:0 6px 18px rgba(0,0,0,.28);
    /* width is the one property here that can't be handed to the compositor
       — animating it forces a real layout pass every frame, on every tile
       resizing at once (the shrinking old-active, the growing new-active,
       any cascading pills). box-shadow used to transition too, which meant
       an expensive blur recalculation on top of that same reflow every
       frame; it now switches instantly instead, since the two costs
       stacking together was the main source of visible jank. */
    transition:width .38s cubic-bezier(.16,1,.3,1);
  }
  .wp-item.is-active{transition:width .38s cubic-bezier(.16,1,.3,1),box-shadow .3s ease}
  .wp-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
    user-select:none;
  }
  /* Only the active tile shows the wallpaper uncropped (object-fit:contain) —
     that's the one the person is actually looking at, so none of it should be
     cut off. Neighbor tiles stay cropped-to-fill peeks, since they're just
     hinting at what's next rather than being the focus. */
  .wp-item.is-active{
    box-shadow:0 16px 44px rgba(0,0,0,.46);
  }
  .wp-item.is-active img{
    object-fit:contain;
    background:#000;
  }
  /* Tiles outside the currently-visible set (see wpItemFraction in the
     script below) get width:0 in JS — this collapses their margin and
     shadow too, so they don't leave a phantom gap or sliver in the strip. */
  .wp-item.is-hidden{
    margin:0;
    box-shadow:none;
    pointer-events:none;
  }
  @media (max-width:760px){
    .wp-item{height:100%}
  }

  .dialog-status{

  /* Loading spinner: a tinted circle with one of the app's own M3 expressive
     shapes (see officialShapes in the script) rendered as a real SVG path —
     the same morph-engine primitive the nav buttons use, so pressing
     Next/Prev smoothly morphs the spinner's silhouette into a new shape
     instead of just spinning in place, reading as part of the same design
     language rather than a generic browser spinner. The .lb-spinner element
     is also nudged horizontally by JS (see positionLbSpinner in the script)
     so it stays centered over the active wallpaper rather than the dialog
     box, since the carousel's active tile isn't always centered in that box
     (it sits flush left/right at the first/last wallpaper). */
  .lb-spinner{
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--md-primary-container);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    position:relative;
    transition:transform .25s ease;
  }
  .lb-spinner.official-shape .morph-shape-svg{
    position:absolute;
    top:22%;
    left:22%;
    width:56%;
    height:56%;
    display:block;
    overflow:visible;
    pointer-events:none;
    transform-origin:center;
    animation:lb-spinner-rotate 1.7s linear infinite;
  }
  .lb-spinner.official-shape .morph-shape-path{
    fill:var(--md-primary);
    transform-box:fill-box;
    transform-origin:center;
  }
  @keyframes lb-spinner-rotate{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    .lb-spinner.official-shape .morph-shape-svg{animation:none !important}
  }

     actually be read, not just implied by the spinner stopping) — visually
     hidden the rest of the time, matching the reference: just the spinner,
     no "Loading…" caption cluttering the photo. */
  .lb-status-text{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

    position:static;
    width:auto;height:auto;
    margin:0;
    clip:auto;
    white-space:normal;
  }
  .dialog-status.error .lb-spinner{display:none}

  /* ---------- Button press ripple ----------
     A quick radial burst from the pointer position on press, on every
     icon/filled/FAB button. Spawned in JS (see spawnRipple) as a plain
     absolutely-positioned span; the button just needs to clip and host it. */
  .icon-btn,.filled-btn,.fab{
    position:relative;
    overflow:hidden;

  /* The shared ripple rule above sets position:relative on everything it
     touches, including the FAB — but the FAB needs position:fixed to stay

     (later in the cascade, same specificity) wins. */
  .fab{
    position:fixed;
    overflow:hidden;

    position:absolute;

  /* ---------- Download success flourish ----------
     Icon morphs to a checkmark and the fill briefly tints toward green with
     a scale-punch, then everything reverts back to the normal Download
     state after a beat (handled in downloadFrame). */
  .filled-btn .icon-check{display:none}
  .filled-btn.is-success .icon-download{display:none}
  .filled-btn.is-success .icon-check{display:block}
  .filled-btn.is-success{

  /* ---------- Confetti burst ----------
     A small handful of colored pieces launched from the Download button on

     driven by the Web Animations API in JS (see fireConfetti), not CSS
     keyframes, so each burst can randomize its own physics without needing

     of a single piece. */
  .confetti-piece{

    top:0;
    left:0;

    border-radius:2px;

    will-change:transform,opacity;

  /* ---------- Card hover/long-press preview ----------
     A single shared floating element, reused for every card instead of
     one per card, since only one preview is ever open at a time. Shown on
     desktop after a short hover delay (see wireCardPreview in JS) and on
     touch after a long-press, so people can peek at the full uncropped
     image without committing to opening the lightbox. */
  .card-preview-float{
    position:fixed;
    top:0;
    left:0;
    z-index:2147483000;
    max-width:min(46vw,520px);
    max-height:min(46vw,520px);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 12px 32px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25);
    opacity:0;
    transform:scale(.94);
    transform-origin:center;
    transition:opacity .16s var(--standard),transform .16s var(--standard);
    pointer-events:none;
    background:var(--md-surface-container-high, #222);
  }
  .card-preview-float.is-visible{
    opacity:1;
    transform:scale(1);
  }
  .card-preview-float img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
  }
  @media (prefers-reduced-motion:reduce){

  /* Desktop-hover-only feature: devices without a fine hover pointer
     (touch/mobile) never get this floating preview at all. */
  @media (hover:none),(pointer:coarse){

  }

  /* ---------- Cursor trail ----------
     A faint paw-print trail that follows the pointer while it moves over
     the gallery grid — desktop only (see the hover:hover/pointer:fine
     guard in JS), purely decorative, and capped to a low spawn rate so it
     never turns into a stream of DOM nodes. */
  .cursor-trail-piece{
    position:fixed;

  /* ---------- Mobile lightbox: single wallpaper, no carousel peeks ----------
     The peek-cascade carousel (see the "Hero carousel" block above) is a
     desktop-hover-friendly browsing aid — on a phone there's no pointer
     hovering over neighbor tiles to hint at, and the shrunk peek tiles just
     eat space that the actual photo could use. So on mobile, the carousel
     engine still runs underneath (still tracks which frame is active, still
     swaps in the full-res image, still preloads neighbors) but only its
     active tile is ever shown, at the full width of the frame — every
     other tile is hidden outright rather than shrunk to a sliver. See
     wpMobileSingleView in the script below, which keeps the track's
     transform in sync with this (the peek-width math it would otherwise use
     no longer matches what's on screen once this rule hides everything but
     the active tile). */
  @media (max-width:760px){
    .wp-item{display:none}
    .wp-item.is-active{
      display:block;
      width:100% !important;
      margin:0;
    }
  }

  /* Long wallpaper names: keep the action controls together and right-aligned
     instead of letting flex-wrap drop them awkwardly to the left. Titles are
     clamped to one line here so the whole popup keeps a fixed height on
     phones regardless of how long a given wallpaper's name is — matching
     the desktop popup, which never resizes between wallpapers. */
  @media (max-width:760px){
    /* Popup never scrolls on mobile, and the full wallpaper name is always
       shown (no truncation) — see .dialog and .dialog-title below. Since
       the title can now wrap to more than one line for long names, the
       image's max-height is a calc() that reserves room for a realistic
       worst case (title up to 3 lines, plus both bars, plus padding) rather
       than a flat guess, so a long name can't push the popup taller than
       the viewport. */
    .dialog{
      overflow:hidden;
    }
    /* Single-photo view (see the earlier ".wp-item{display:none}" rule):
       size the frame around the wallpaper's own proportions instead of a
       fixed 16:9 box. Most wallpapers here are portrait, so a landscape-
       shaped frame was letterboxing nearly every one — big black bars down
       the sides. min-height keeps the "Loading…" state from collapsing to
       nothing before the image's real size is known.
       Only the default (non-maximized) view — true-fullscreen maximized
       mode further down still fills the whole screen and lets
       object-fit:contain do its normal letterboxing there, which is
       correct once you're deliberately going edge-to-edge. */
    .dialog-media{
      width:100%;
      aspect-ratio:auto;
      height:auto;
      max-height:none;
      min-height:160px;
    }
    .dialog:not(.is-maximized) .wp-carousel,
    .dialog:not(.is-maximized) .wp-track,
    .dialog:not(.is-maximized) .wp-item.is-active{
      height:auto;
    }
    .dialog:not(.is-maximized) .wp-item.is-active img{
      height:auto;
      /* 94vh (.dialog's own cap) minus a conservative reservation for
         .dialog-top (~56px incl. margin) + .dialog-bottom's two rows with
         a title wrapped to 3 lines (~78px) + the row-gap (16px) + the
         bottom actions row (~44px) + .dialog's own padding (~20px) — with
         some slack built in on top of that estimate. */
      max-height:calc(94vh - 280px);
    }
    /* #lbCount moves out of here into .dialog-actions below (see
       relocateLbCountForViewport) — .dialog-top-actions is the only child
       left, so space-between (which assumed two children splitting the
       row) would otherwise collapse it to the left instead of keeping it
       pinned to the right. */
    .dialog-top{justify-content:flex-end}
    /* Two rows instead of desktop's single "title left, buttons right" row:
       title+download on top, then prev/counter/next below it, centered —
       matches the reference layout. Row 2 (.dialog-actions) is its own
       independent flex row rather than sharing row 1's grid columns —
       Prev and Next are the same width (44px icon buttons), so
       justify-content:space-between naturally centers the counter between
       them; sharing columns with row 1 instead would size the left/right
       columns unevenly (Prev's 44px vs. Download's much wider pill),
       visibly skewing the counter off-center. The counter (#lbCount) is
       physically moved into .dialog-actions, between Prev and Next, by the
       script below (see wpMobileSingleView) — it lives in .dialog-top
       instead on desktop. */
    .dialog-bottom{
      display:grid;
      grid-template-columns:1fr auto;
      grid-template-areas:
        "title    download"
        "actions  actions";
      row-gap:16px;
      align-items:start;
    }
    .dialog-actions{
      grid-area:actions;
      display:flex;
      justify-content:space-between;
      align-items:center;
      width:100%;
    }
    /* Full name, never truncated — wraps across as many lines as it needs
       instead of clipping with an ellipsis (the max-height calc() above
       already accounts for it running up to ~3 lines). */
    .dialog-title{
      grid-area:title;
      align-self:center;
    }
    #lbDownload{grid-area:download; align-self:center;}
    /* Plain centered counter text between the buttons, not the small pill
       it is up in .dialog-top on desktop — space-between above already
       does the centering (see .dialog-bottom comment), this just strips
       the pill styling. */
    #lbCount{
      padding:0;
      border:none;
      background:none;
      font-size:14px;
    }

    /* ---------- Mobile maximize: true edge-to-edge fullscreen ----------
       On phones, stretching the framed modal taller (the desktop maximize
       behavior) barely helps — the modal is already ~98vw wide, so there's
       nowhere for it to grow into. Instead, maximize here drops the frame
       entirely: the photo fills the whole screen, and the title/count/
       action bars float on top as translucent overlays that fade away on
       their own and reappear on a tap — the same shape as a native phone
       photo viewer. Swiping down anywhere on the image closes it, since
       the close button itself is hidden most of the time. */
    .dialog.is-maximized{
      position:fixed;
      inset:0;
      width:100vw;
      height:100dvh;
      max-height:100dvh;
      margin:0;
      padding:0;
      border:none;
      border-radius:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      transition:transform .25s ease,opacity .2s ease;
    }
    .scrim:has(.dialog.is-maximized){
      padding:0;
      background:#000;
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
    }
    .dialog.is-maximized .dialog-media{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      max-height:none;
      aspect-ratio:auto;
      border-radius:0;
      border:none;
    }
    .dialog.is-maximized .dialog-top,
    .dialog.is-maximized .dialog-bottom{
      position:absolute;
      left:0;
      right:0;
      z-index:5;
      margin:0;
      transition:opacity .3s ease,transform .3s ease;
    }
    .dialog.is-maximized .dialog-top{
      top:0;
      padding:14px 14px 26px;
      background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);
    }
    .dialog.is-maximized .dialog-bottom{
      bottom:0;
      padding:26px 14px 14px;
      background:linear-gradient(to top,rgba(0,0,0,.7),transparent);
    }
    /* Controls auto-hide (see the JS timer) or hide the instant the person
       starts a swipe-to-close drag, so nothing half-fades mid-gesture. */
    .dialog.is-maximized.chrome-hidden .dialog-top{
      opacity:0;
      transform:translateY(-10px);
      pointer-events:none;
    }
    .dialog.is-maximized.chrome-hidden .dialog-bottom{
      opacity:0;
      transform:translateY(10px);
      pointer-events:none;
    }
    /* Phones, full screen: let the browser's native two-finger pinch-zoom
       through instead of eating it. This used to be touch-action:none,
       which blocks every native gesture on the element - panning AND
       pinch-zoom alike - so there was no way to zoom in on a wallpaper at
       all in this view. 'pinch-zoom' keeps that same panning block (our
       own pointer handlers below still own single-finger drag: swipe down
       to close, tap to toggle the bars) while carving out an exception for
       the two-finger zoom gesture specifically, so the browser handles
       that natively without any custom zoom/pan code needed. */
    .dialog.is-maximized .wp-carousel{touch-action:pinch-zoom}
  }

  @media (max-width:640px){

  }

  /* ============================================================

  /* Cards: a little more physicality without making the gallery noisy. */
  .card{
    will-change:transform,box-shadow,border-radius,opacity;
  }
  .card:active{
    transform:translateY(-2px) scale(.975) !important;
    transition-duration:.15s !important;
  }
  .card.filter-hidden{
    opacity:0 !important;
    transform:scale(.965) translateY(5px) !important;
    filter:saturate(.72);
  }
  .card.is-color-enter{
    animation:expressive-card-enter .48s cubic-bezier(.22,1.2,.36,1) both;

<script>
/* ---------- Preview protection ---------- */
// Wallpapers can only be saved through the site's Download button.
// Disable the browser context menu and native image dragging across the page.
document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('dragstart', event => {
  if(event.target instanceof HTMLImageElement || event.target.closest?.('.card, .dialog-media')){
    event.preventDefault();
  }
});

/* ---------- Wallpaper source ----------
   Every image in this GitHub repo path shows up automatically — upload a
   file there and it appears here on next page load, no code changes. ---- */
const GITHUB_SOURCE = {
  user:   'Blapples',
  repo:   'wallpapers',
  path:   '',       // '' = repo root
  branch: 'main',
};

function titleFromFilename(name){
  return name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

/*
 * The GitHub file is always kept as the ORIGINAL source.
 * Cards and the lightbox use resized/compressed preview URLs so opening the
 * gallery never forces a phone/tablet/PC to download a huge wallpaper.
 * The original GitHub URL is used only when the user presses Download.
 *
 * wsrv.nl is an image-resizing proxy: it fetches the public GitHub image,
 * resizes it server-side, and returns a much smaller image.
 */
const PREVIEW_PROXY = 'https://wsrv.nl/';
const PREVIEW_QUALITY = 72;

// Phones do not need desktop-sized preview assets. Keeping these smaller
// reduces network transfer, image decoding, memory use, and GPU texture size.
const IS_MOBILE_DEVICE = window.matchMedia('(max-width: 640px)').matches ||
  /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const CARD_PREVIEW_WIDTH = IS_MOBILE_DEVICE ? 640 : 960;
const LIGHTBOX_PREVIEW_WIDTH = IS_MOBILE_DEVICE ? 1080 : 1600;

function makePreviewUrl(originalUrl, width){
  if(!originalUrl || originalUrl.startsWith('data:') || originalUrl.startsWith('blob:')){
    return originalUrl;
  }
  return `${PREVIEW_PROXY}?url=${encodeURIComponent(originalUrl)}&w=${width}&q=${PREVIEW_QUALITY}&fit=inside&output=webp`;
}

function normalizeFrame(frame){
  if(!frame || typeof frame !== 'object') return frame;
  if(!frame.src) return frame;
  frame.previewSrc = frame.previewSrc || makePreviewUrl(frame.src, CARD_PREVIEW_WIDTH);
  frame.lightboxSrc = frame.lightboxSrc || makePreviewUrl(frame.src, LIGHTBOX_PREVIEW_WIDTH);
  return frame;
}

/* ---------- Color sampling (Matugen-inspired) ----------
 * Matugen does not simply average all pixels. It downsizes the wallpaper,
 * quantizes it into a palette, removes very low-chroma colors, then scores
 * the remaining candidates by visual importance/population. We mirror that
 * idea here in browser-safe JS, then map the winning source color into one
 * of our six filter families.
 */
const COLOR_SAMPLE_WIDTH = 112;

function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d){
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  return {h,s:max===0?0:d/max,v:max};
}

// Six broad Material-like hue families. The boundaries deliberately overlap
// the natural visual regions rather than treating every shade as a new color.
function hueFamily(h){
  if(h>=345 || h<15) return 'red';
  if(h>=15 && h<45) return 'orange';
  if(h>=45 && h<75) return 'yellow';
  // Green intentionally owns mint, lime, emerald, sea-green and turquoise-green.
  if(h>=75 && h<190) return 'green';
  if(h>=190 && h<255) return 'blue';
  return 'purple';
}

const COLOR_CLASS_PALETTE = [
  {key:'red',    rgb:[224,72,62],   hue:0},
  {key:'orange', rgb:[224,138,62],  hue:30},
  {key:'yellow', rgb:[224,201,62],  hue:60},
  {key:'green',  rgb:[108,191,92],  hue:130},
  {key:'blue',   rgb:[76,127,224],  hue:220},
  {key:'purple', rgb:[138,92,224],  hue:285},
];

/*
 * Matugen-style palette extraction:
 *  1. resize to 112px
 *  2. quantize RGB into compact bins
 *  3. discard near-gray colors (low chroma)
 *  4. score candidates by population + chroma + a mild saturation bonus
 *  5. choose the strongest representative color
 *
 * This is intentionally NOT a plain average. A small but strongly saturated
 * blue area can matter, while a huge black/white background cannot incorrectly
 * force a colorful wallpaper into a neutral bucket.
 */
function computeFrameColor(frame){
  return new Promise(resolve=>{
    if(!frame?.src) return resolve(null);
    let settled=false;
    const finish=value=>{ if(settled) return; settled=true; clearTimeout(timer); resolve(value); };
    const timer=setTimeout(()=>finish(null),7000);
    const probe=new Image();
    probe.crossOrigin='anonymous';
    probe.onload=()=>{
      try{
        const w=COLOR_SAMPLE_WIDTH;
        const h=Math.max(1,Math.round((probe.naturalHeight/probe.naturalWidth)*w));
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=Math.min(h,112);
        const ctx=canvas.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(probe,0,0,canvas.width,canvas.height);
        const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
        const familyScores=new Map();
        const familyPixels=new Map();
        let neutral=0;
        const bins=new Map();

        for(let i=0;i<data.length;i+=4){
          if(data[i+3]<16) continue;
          const r=data[i],g=data[i+1],b=data[i+2];
          const hsv=rgbToHsv(r,g,b);
          // Quantize first so similar pastel/dark shades reinforce each other.
          const qr=Math.round(r/16)*16, qg=Math.round(g/16)*16, qb=Math.round(b/16)*16;
          const k=(qr<<16)|(qg<<8)|qb;
          const item=bins.get(k);
          if(item) item.count++;
          else bins.set(k,{r:qr,g:qg,b:qb,count:1});
        }

        for(const item of bins.values()){
          const hsv=rgbToHsv(item.r,item.g,item.b);
          const population=item.count;
          if(hsv.s<0.10 || hsv.v<0.08){ neutral+=population; continue; }
          const family=hueFamily(hsv.h);
          // Population dominates. Saturation/value gently emphasize actual color
          // without letting tiny vivid accents beat the wallpaper's main family.
          const strength=population*(0.80 + 0.20*hsv.s)*(0.78 + 0.22*hsv.v);
          familyScores.set(family,(familyScores.get(family)||0)+strength);
          familyPixels.set(family,(familyPixels.get(family)||0)+population);
        }

        if(!familyScores.size){
          // Neutral wallpaper: use the average hue only as a deterministic fallback.
          let sr=0,sg=0,sb=0,n=0;
          for(let i=0;i<data.length;i+=4){ if(data[i+3]<16) continue; sr+=data[i];sg+=data[i+1];sb+=data[i+2];n++; }
          if(!n) return finish(null);
          const r=Math.round(sr/n),g=Math.round(sg/n),b=Math.round(sb/n);
          return finish({r,g,b,key:'blue'});
        }

        let key='green',best=-1;
        for(const [family,score] of familyScores){
          if(score>best){best=score;key=family;}
        }

        // Representative color = weighted average of the winning family's
        // quantized palette colors. This keeps pastel/dark shades in the same family.
        let rr=0,gg=0,bb=0,ww=0;
        for(const item of bins.values()){
          const hsv=rgbToHsv(item.r,item.g,item.b);
          if(hsv.s<0.10 || hsv.v<0.08 || hueFamily(hsv.h)!==key) continue;
          const weight=item.count*(0.8+0.2*hsv.s);
          rr+=item.r*weight; gg+=item.g*weight; bb+=item.b*weight; ww+=weight;
        }
        const r=Math.round(rr/ww),g=Math.round(gg/ww),b=Math.round(bb/ww);
        finish({r,g,b,key});
      }catch(err){ finish(null); }
    };
    probe.onerror=()=>finish(null);
    probe.src=makePreviewUrl(frame.src,COLOR_SAMPLE_WIDTH);
  });
}
async function fetchWallpapersFromGitHub(src){
  const apiUrl = `https://api.github.com/repos/${src.user}/${src.repo}/contents/${src.path}?ref=${src.branch}`;
  const res = await fetch(apiUrl, { headers:{ Accept:'application/vnd.github+json' } });
  if(!res.ok) throw new Error(`GitHub API responded ${res.status}`);
  const files = await res.json();
  if(!Array.isArray(files)) throw new Error('Unexpected GitHub API response');
  const imageExt = /\.(png|jpe?g|webp|gif)$/i;
  return files
    .filter(f => f.type === 'file' && imageExt.test(f.name))
    .sort((a,b) => a.name.localeCompare(b.name))
    .map((f, i) => {
      const originalUrl = f.download_url;
      return normalizeFrame({
        title: titleFromFilename(f.name),
        src: originalUrl,
        previewSrc: makePreviewUrl(originalUrl, CARD_PREVIEW_WIDTH),
        lightboxSrc: makePreviewUrl(originalUrl, LIGHTBOX_PREVIEW_WIDTH),
        filename: f.name,
        frameNo: i + 1,
      });
    });
}

function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ seed>>>15, 1 | seed);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

function paintWallpaper(ctx,w,h,family){
  ctx.fillStyle = family.bg;
  ctx.fillRect(0,0,w,h);
  const blobCount = 3 + Math.floor(rand()*2);
  for(let i=0;i<blobCount;i++){
    const hex = family.colors[i % family.colors.length];
    const cx = rand()*w, cy = rand()*h;
    const r = (0.4 + rand()*0.4) * Math.max(w,h);
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    grad.addColorStop(0, hexToRgba(hex,0.95));
    grad.addColorStop(1, hexToRgba(hex,0));
    ctx.globalCompositeOperation = i===0 ? 'source-over' : 'lighten';
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
  }
  ctx.globalCompositeOperation = 'source-over';
  const vgrad = ctx.createRadialGradient(w/2,h/2,h*0.15,w/2,h/2,h*0.8);
  vgrad.addColorStop(0,'rgba(0,0,0,0)');
  vgrad.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle = vgrad;
  ctx.fillRect(0,0,w,h);
}

/*
 * Keep a small local copy of the GitHub wallpaper manifest.
 *
 * This is important when the HTML file is opened directly from disk
 * (file://). Browsers can occasionally block, delay, or rate-limit the
 * GitHub API on a refresh. Previously the page waited for that request
 * before building the cards, so a refresh could leave an empty gallery.
 *
 * The cache lets the last successfully loaded wallpaper list render
 * immediately, while GitHub is refreshed quietly in the background.
 */
const WALLPAPER_CACHE_KEY = 'blapples-wallpaper-manifest-v2';

function readWallpaperCache(){
  try{
    const raw = localStorage.getItem(WALLPAPER_CACHE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!Array.isArray(data) || !data.length) return null;
    return data.filter(item =>
      item &&
      typeof item.title === 'string' &&
      typeof item.src === 'string' &&
      typeof item.filename === 'string'
    ).map(normalizeFrame);
  }catch(err){
    console.warn('Wallpaper cache could not be read:', err);
    return null;
  }
}

function writeWallpaperCache(frames){
  try{
    const clean = frames.map(frame => ({
      title: frame.title,
      src: frame.src,
      previewSrc: frame.previewSrc || makePreviewUrl(frame.src, CARD_PREVIEW_WIDTH),
      lightboxSrc: frame.lightboxSrc || makePreviewUrl(frame.src, LIGHTBOX_PREVIEW_WIDTH),
      filename: frame.filename,
      frameNo: frame.frameNo
    }));
    localStorage.setItem(WALLPAPER_CACHE_KEY, JSON.stringify(clean));
  }catch(err){
    // Storage can be unavailable in private/file contexts; the gallery
    // still works without it.
    console.warn('Wallpaper cache could not be written:', err);
  }
}

/* ---------- "New" wallpaper tracking ----------
 * There's no backend, so "new" is tracked the same way the manifest cache
 * above already is: locally, per browser, keyed by filename. The first
 * time this code ever runs, the current collection becomes the baseline
 * (nothing is "new" yet, so shipping this feature doesn't badge every
 * existing wallpaper). After that, any filename this browser hasn't seen
 * before is stamped with the current time and counts as new for
 * NEW_WINDOW_MS - after which it quietly goes back to being a normal
 * card with no badge, in its normal spot in the main grid.
 */
const NEW_TRACKING_KEY = 'blapples-wallpaper-first-seen-v1';
const NEW_WINDOW_MS = 7 * 24 * 60 * 60 * 1000; // 1 week

function readFirstSeenMap(){
  try{
    const raw = localStorage.getItem(NEW_TRACKING_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    return (data && typeof data === 'object') ? data : null;
  }catch(err){
    console.warn('New-wallpaper tracking could not be read:', err);
    return null;
  }
}

function writeFirstSeenMap(map){
  try{
    localStorage.setItem(NEW_TRACKING_KEY, JSON.stringify(map));
  }catch(err){
    console.warn('New-wallpaper tracking could not be written:', err);
  }
}

/*
 * Stamps each frame with firstSeenAt/isNew. The `isAuthoritative` flag
 * matters because init() renders twice: once from the (possibly stale or
 * incomplete) local cache for an instant paint, then again once the live
 * GitHub listing comes back. Only the live listing is allowed to decide
 * "this browser has never seen this file before" and write that decision
 * to storage - otherwise a stale cache on a fresh browser could wrongly
 * treat older wallpapers as brand new just because they were missing from
 * that cache.
 */
function trackNewWallpapers(frames, isAuthoritative=true){
  const now = Date.now();
  let map = readFirstSeenMap();

  if(!isAuthoritative){
    frames.forEach(frame=>{
      const firstSeenAt = frame.filename ? map?.[frame.filename] : undefined;
      frame.firstSeenAt = firstSeenAt;
      frame.isNew = firstSeenAt != null && (now - firstSeenAt) < NEW_WINDOW_MS;
    });
    return frames;
  }

  const isBootstrap = !map;
  if(!map) map = {};

  const seenFilenames = new Set();
  frames.forEach(frame=>{
    if(!frame.filename) return;
    seenFilenames.add(frame.filename);
    if(!(frame.filename in map)){
      // Brand new to this browser's tracking. On the very first run ever
      // (no stored map at all) back-date it so the existing collection
      // doesn't suddenly launch as "new"; otherwise stamp it with now.
      map[frame.filename] = isBootstrap ? (now - NEW_WINDOW_MS - 1) : now;
    }
    const firstSeenAt = map[frame.filename];
    frame.firstSeenAt = firstSeenAt;
    frame.isNew = (now - firstSeenAt) < NEW_WINDOW_MS;
  });

  // Forget wallpapers that no longer exist in the repo so this can't grow forever.
  Object.keys(map).forEach(filename=>{
    if(!seenFilenames.has(filename)) delete map[filename];
  });

  writeFirstSeenMap(map);
  return frames;
}

/* ---------- "New" wallpaper tracking, take two: real commit history ----------
 * The localStorage approach above answers "has THIS browser seen this file
 * before", which means a wallpaper only ever looks new on whichever device
 * happened to be open when it was uploaded - a phone visiting for the first
 * time sees nothing, even the same day a desktop browser saw it land. This
 * asks GitHub's own commit history instead, so "new" means the same thing -
 * added to the repo within NEW_WINDOW_MS - on every device. It's used to
 * override the localStorage-based guess once it resolves (see
 * applyGitHistoryNewFlags below); the guess above still handles the very
 * first, instant paint before this network round-trip finishes.
 */
const NEW_COMMITS_CACHE_KEY = 'blapples-wallpaper-recent-commits-v1';
// An hour is plenty fresh for a "within the last 7 days" badge, and keeps a
// burst of page loads from re-walking commit history every single time.
const NEW_COMMITS_CACHE_TTL_MS = 60 * 60 * 1000;

function readRecentCommitsCache(){
  try{
    const raw = localStorage.getItem(NEW_COMMITS_CACHE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!data || typeof data !== 'object' || !data.added || !(Date.now() - data.fetchedAt < NEW_COMMITS_CACHE_TTL_MS)){
      return null;
    }
    return data.added; // filename -> commit date (ms)
  }catch(err){
    return null;
  }
}

function writeRecentCommitsCache(added){
  try{
    localStorage.setItem(NEW_COMMITS_CACHE_KEY, JSON.stringify({fetchedAt: Date.now(), added}));
  }catch(err){
    // Non-fatal - just means the next load re-fetches instead of hitting cache.
  }
}

async function fetchRecentlyAddedFilenames(){
  const cached = readRecentCommitsCache();
  if(cached) return cached;

  const {user, repo, path, branch} = GITHUB_SOURCE;
  const since = new Date(Date.now() - NEW_WINDOW_MS).toISOString();
  const pathParam = path ? `&path=${encodeURIComponent(path)}` : '';
  const listUrl = `https://api.github.com/repos/${user}/${repo}/commits?sha=${encodeURIComponent(branch)}&since=${since}${pathParam}&per_page=100`;

  const res = await fetch(listUrl, { headers:{ Accept:'application/vnd.github+json' } });
  if(!res.ok) throw new Error(`GitHub commits API responded ${res.status}`);
  const commits = await res.json();
  if(!Array.isArray(commits)) throw new Error('Unexpected GitHub commits response');

  // A week's worth of uploads is normally a handful of commits, not dozens -
  // capped defensively so an unusually active repo can't turn this into an
  // unbounded pile of follow-up requests against the (unauthenticated,
  // 60/hour) GitHub API.
  const capped = commits.slice(0, 25);
  const details = await Promise.all(capped.map(c =>
    fetch(`https://api.github.com/repos/${user}/${repo}/commits/${c.sha}`, { headers:{ Accept:'application/vnd.github+json' } })
      .then(r => r.ok ? r.json() : null)
      .catch(()=>null)
  ));

  const added = {};
  details.forEach((detail, i) => {
    if(!detail || !Array.isArray(detail.files)) return;
    const dateStr = capped[i].commit?.author?.date || capped[i].commit?.committer?.date;
    const commitDate = dateStr ? new Date(dateStr).getTime() : Date.now();
    detail.files.forEach(f => {
      // Only a file actually being added counts as new - an edit or rename
      // of an existing wallpaper shouldn't relaunch it as "new" again.
      if(f.status !== 'added') return;
      const filename = f.filename.split('/').pop();
      if(!(filename in added) || commitDate < added[filename]){
        added[filename] = commitDate;
      }
    });
  });

  writeRecentCommitsCache(added);
  return added;
}

function readConfirmedDates(){
  let dates = {...BASELINE_CONFIRMED_DATES};
  try{
    const raw = localStorage.getItem(CONFIRMED_DATES_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(data && typeof data === 'object') dates = {...dates, ...data};
    }
  }catch(err){
    // Ignore - the baseline above still gives correct, consistent ordering.
  }
  return dates;
}

function mergeConfirmedDates(added, knownFilenames){
  const dates = readConfirmedDates();
  Object.keys(added).forEach(filename=>{
    if(!(filename in dates) || added[filename] < dates[filename]){
      dates[filename] = added[filename];
    }
  });
  // Forget anything no longer in the collection, same as the first-seen map.
  if(knownFilenames){
    Object.keys(dates).forEach(filename=>{
      if(!knownFilenames.has(filename)) delete dates[filename];
    });
  }
  try{
    localStorage.setItem(CONFIRMED_DATES_KEY, JSON.stringify(dates));
  }catch(err){
    // Non-fatal - sorting just falls back to unconfirmed order next load.
  }
  return dates;
}

// Newest confirmed date first; anything without a confirmed date keeps its
// existing relative order and sorts after every dated wallpaper.
function sortFramesByRecency(frames){
  const dates = readConfirmedDates();
  return frames
    .map((frame, i) => ({
      frame, i,
      date: frame.filename && frame.filename in dates ? dates[frame.filename] : null,
    }))
    .sort((a, b) => {
      if(a.date != null && b.date != null) return b.date - a.date;
      if(a.date != null) return -1;
      if(b.date != null) return 1;
      return a.i - b.i; // stable: no confirmed date for either, leave as-is
    })
    .map(x => x.frame);
}

// Runs after the authoritative GitHub manifest is already rendered (with
// the localStorage-based isNew guess). Once the real commit-history answer
// comes back, this corrects any frame whose guess was wrong - most
// commonly a first-time visit on a new device, where the guess was "not
// new" for everything - and refreshes the New Wallpapers section, each
// card's badge, and the main-grid duplicate-hiding to match. It also
// merges the newly-confirmed dates into the permanent sort record and
// reorders the already-built cards to match, without reloading them.
async function applyGitHistoryNewFlags(frames){
  let added;
  try{
    added = await fetchRecentlyAddedFilenames();
  }catch(err){
    console.warn('Could not confirm new wallpapers from git history, keeping the local guess:', err.message);
    return;
  }
  let changed = false;
  frames.forEach(frame=>{
    const isNew = !!(frame.filename && frame.filename in added);
    if(frame.isNew !== isNew){
      frame.isNew = isNew;
      changed = true;
    }
  });

  const knownFilenames = new Set(frames.map(f => f.filename).filter(Boolean));
  mergeConfirmedDates(added, knownFilenames);

  // Always resort using the latest known dates (baseline + anything just
  // learned), and reorder the main grid's existing cards to match - not
  // just when this particular call learned brand-new dates, since a
  // second browser tab, a previous session, or the baked-in baseline can
  // all mean there's a more up-to-date order available than whatever the
  // page happened to render first.
  const sorted = sortFramesByRecency(frames);
  sorted.forEach(frame => { if(frame._card) grid.appendChild(frame._card); });

  if(!changed) return;
  // Bug fix: this used to pass the original, un-resorted `frames` here,
  // so the New Wallpapers section kept whatever order it first rendered
  // in even after the main grid above was correctly reordered - pass the
  // same `sorted` list so the two never drift out of sync with each other.
  renderNewSection(sorted);
  sorted.forEach(frame=>{
    if(frame._card){
      syncNewBadge(frame._card, frame);
      applyColorFilterToCard(frame._card);
    }
  });
}

 * Separate, filename-keyed cache just for sampled colors. Kept independent
 * of the wallpaper manifest cache above because the GitHub refresh path

  try{

  }catch(err){
    console.warn('Color cache could not be read:', err);

}

function setCardFilterVisible(card, visible){

    card.hidden = false;

    requestAnimationFrame(()=> card.classList.remove('filter-hidden'));
  }else{

    card.classList.add('filter-hidden');
    window.setTimeout(()=>{

    }, 220);
  }

function cardMatchesColorFilter(card){
  const frame=frameData[card.dataset.id];
  if(frame && frame.isNew){
    // New wallpapers live exclusively in the New Wallpapers section while
    // browsing "All colors" - showing them in the main grid too would just
    // duplicate them. Once a specific color is selected, though, the New
    // section hides itself (see updateNewSectionVisibility), so this is the
    // only place left to find them - they rejoin the main grid, filtered
    // like everything else, still carrying the New badge from buildCard.
    if(activeColor===null) return false;
    return !!(frame.colorKey && frame.colorKey===activeColor);
  }
  return activeColor===null || !!(frame && frame.colorKey && frame.colorKey===activeColor);
}

  if(card) setCardFilterVisible(card,cardMatchesColorFilter(card));
}

/* ---------- Lazy-load card images near the viewport ---------- */
const CARD_PRELOAD_MARGIN = '700px 0px';

const cardImageLoader = ('IntersectionObserver' in window)
  ? new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting) return;

        const img = entry.target;
        const src = img.dataset.lazySrc;
        if(src && !img.dataset.lazyLoaded){
          img.src = src;
          img.dataset.lazyLoaded = 'true';

          // Let the browser decode before revealing the image.
          if(img.decode){
            img.decode().catch(()=>{}).finally(()=>{
              img.removeAttribute('data-lazy-src');
            });
          }else{
            img.removeAttribute('data-lazy-src');
          }
        }

        cardImageLoader.unobserve(img);
      });
    }, {
      root:null,
      rootMargin:CARD_PRELOAD_MARGIN,
      threshold:0.01
    })
  : null;

function prepareCardImage(img){
  if(!img) return;

  // Don't interfere with images that are already loaded.
  if(img.dataset.lazyPrepared === 'true') return;
  img.dataset.lazyPrepared = 'true';

  const src = img.getAttribute('src');
  if(!src) return;

  img.dataset.lazySrc = src;
  img.removeAttribute('src');
  img.setAttribute('loading','lazy');
  img.setAttribute('decoding','async');

  if(cardImageLoader){
    cardImageLoader.observe(img);
  }else{
    img.src = img.dataset.lazySrc;
    img.dataset.lazyLoaded = 'true';
  }
}

function prepareCardImages(root=document){
  root.querySelectorAll?.('.card img').forEach(prepareCardImage);
}

/* Reveal cards as they enter the viewport. */
const cardRevealObserver = ('IntersectionObserver' in window)
  ? new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add('is-visible');
          cardRevealObserver.unobserve(entry.target);
        }
      });
    }, {
      root:null,
      rootMargin:'0px 0px -8% 0px',
      threshold:0.08
    })
  : null;

function observeCardReveal(card){
  if(!card) return;
  if(cardRevealObserver){
    cardRevealObserver.observe(card);
  }else{
    card.classList.add('is-visible');
  }
}

function observeAllCardReveals(){
  grid.querySelectorAll('.card').forEach(observeCardReveal);
}

function applyColorFilter(){
  // Batched version of setCardFilterVisible's "show" path: calling
  // applyColorFilterToCard per-card here previously forced a synchronous
  // layout reflow (void card.offsetWidth) once for every single card being
  // revealed, one after another — on a large gallery that's dozens of
  // forced reflows for one filter click. All the "reveal" writes now happen
  // first, then a single reflow covers the whole batch, then every card's
  // fade-in class is removed on the same frame — same end state and timing
  // as before, just without the per-card layout thrashing.
  const cards = grid.querySelectorAll('.card');
  const toReveal = [];
  cards.forEach(card=>{
    const visible = cardMatchesColorFilter(card);
    if(visible){
      if(card.hidden){
        card.hidden = false;
        card.classList.add('filter-hidden');
        toReveal.push(card);
      }
    }else{
      if(!card.hidden){
        card.classList.add('filter-hidden');
        window.setTimeout(()=>{
          if(card.classList.contains('filter-hidden')) card.hidden = true;
        }, 220);
      }
    }
  });
  if(toReveal.length){
    void grid.offsetWidth; // single forced reflow for the whole batch
    requestAnimationFrame(()=> toReveal.forEach(card => card.classList.remove('filter-hidden')));
  }
  observeAllCardReveals();
  prepareCardImages(grid);
}

/* Automatically pick up cards added by the wallpaper renderer/cache. */
if('MutationObserver' in window){
  const cardMutationObserver = new MutationObserver((mutations)=>{
    mutations.forEach(mutation=>{
      mutation.addedNodes.forEach(node=>{
        if(node.nodeType !== 1) return;
        if(node.classList?.contains('card')){
          observeCardReveal(node);
          prepareCardImages(node);
        }
        node.querySelectorAll?.('.card').forEach(card=>{
          observeCardReveal(card);
          prepareCardImages(card);
        });
      });
    });
  });
  cardMutationObserver.observe(grid, {childList:true, subtree:true});
}

function ensureColorChip(colorKey){
  if(colorChipEls.has(colorKey)) return colorChipEls.get(colorKey);
  const meta = COLOR_BUCKETS.find(b=>b.key===colorKey);
  if(!meta) return null;

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'color-chip';
  btn.dataset.color = colorKey;
  btn.setAttribute('aria-pressed','false');
  btn.innerHTML =
    `<span class="color-chip-swatch" style="background:${meta.swatch}" aria-hidden="true"></span>${meta.label}<span class="color-chip-count"></span>`;
  btn.addEventListener('click', ()=> setActiveColor(colorKey));
  colorChipEls.set(colorKey, btn);

  // Not inserted into the DOM yet. Chips stay off-track (but keep
  // accumulating counts via registerColorForFrame) while the shimmer
  // placeholders are showing; revealColorChips() adds the whole
  // discovered set at once, in a fixed rainbow order.
  return btn;
}

function registerColorForFrame(frame){
  if(!COLOR_CLASS_PALETTE.some(c=>c.key===frame.colorKey)) return;
  const key=frame.colorKey;
  colorCounts.set(key,(colorCounts.get(key)||0)+1);
  const chip=ensureColorChip(key);
  const countEl=chip?.querySelector('.color-chip-count');
  if(countEl) countEl.textContent=`· ${colorCounts.get(key)}`;
  if(frame._card) applyColorFilterToCard(frame._card);

function renderColorChipSkeletons(){

    const sk = document.createElement('span');
    sk.className = 'color-chip-skeleton';
    sk.style.width = width + 'px';

}

// Swaps the shimmer placeholders for every color that was actually
// discovered, inserted together in a fixed rainbow order and given a
// short stagger so the reveal reads as one deliberate motion.
function revealColorChips(){
  clearColorChipSkeletons();
  colorFilterTrack.removeAttribute('aria-busy');
  let i = 0;
  COLOR_BUCKETS.forEach(({key})=>{
    const btn = colorChipEls.get(key);
    if(!btn) return;
    colorFilterTrack.appendChild(btn);
    const delay = Math.min(i, 6) * 40;
    i++;
    window.setTimeout(()=>{
      requestAnimationFrame(()=> btn.classList.add('chip-in'));
    }, delay);
  });
}

function resetColorFilterUI(total){
  colorChipEls.forEach((el,key)=>{ if(key!=='all') el.remove(); });
  colorChipEls.clear();
  colorChipEls.set('all', colorFilterAllBtn);
  colorCounts.clear();
  activeColor = null;
  applyColorTheme(null);
  clearColorChipSkeletons();
  colorFilterAllCount.textContent = total ? `· ${total}` : '';
  if(total > 0){
    renderColorChipSkeletons();
    colorFilterTrack.setAttribute('aria-busy','true');
  }else{
    colorFilterTrack.removeAttribute('aria-busy');
  }
  updateChipStates();
  updateNewSectionVisibility();
}

  const cache=readColorCache();
  const CONCURRENCY=6;
  let idx=0, cacheDirty=false;
  async function worker(){
    while(idx<frames.length){
      if(generation!==renderGeneration) return;
      const frame=frames[idx++];
      if(!frame) continue;
      const cached=frame.filename && cache[frame.filename];
      const valid=cached && COLOR_CLASS_PALETTE.some(c=>c.key===cached.key) &&
        Number.isFinite(cached.r)&&Number.isFinite(cached.g)&&Number.isFinite(cached.b);
      let result=valid?cached:await computeFrameColor(frame);
      if(generation!==renderGeneration) return;
      if(!result) result={r:128,g:128,b:128,key:'blue'};
      frame.colorKey=result.key;
      frame.colorSample=`rgb(${result.r},${result.g},${result.b})`;
      registerColorForFrame(frame);
      if(frame.filename && !valid){ cache[frame.filename]=result; cacheDirty=true; }
    }
  }
  await Promise.all(Array.from({length:Math.min(CONCURRENCY,Math.max(1,frames.length))},worker));
  if(generation!==renderGeneration) return;
  if(cacheDirty) writeColorCache(cache);
  revealColorChips();
  // If cards have already been created, immediately apply any active filter.
  applyColorFilter();
}
let renderGeneration = 0;

/* ---------- New Wallpapers section ----------
 * A second, smaller set of cards for whichever wallpapers trackNewWallpapers
 * marked isNew. These are separate DOM elements from the main grid's cards
 * (the simplest way to show the same wallpaper in two places), but clicking
 * one opens the exact same lightbox/pool as the main grid, keyed off the
 * shared frame.frameNo id - so prev/next still walks the full collection.
 */
const newSection = document.getElementById('newSection');
const newGrid = document.getElementById('newGrid');
// Whether the current manifest has any wallpapers less than a week old.
// Tracked separately from newSection.hidden itself because visibility also
// depends on activeColor (see updateNewSectionVisibility) - this flag is
// the "are there any at all" half of that, refreshed once per render.
let hasNewFrames = false;

// The New Wallpapers section is an "All colors" showcase only: picking a
// specific color filter hides it, since a color-filtered view of only-new
// arrivals isn't a useful browsing mode on its own (see cardMatchesColorFilter,
// which is what surfaces new wallpapers into the main grid instead once a
// color is active). Called after every color-filter change and re-render.
function updateNewSectionVisibility(){
  if(!newSection) return;
  newSection.hidden = !hasNewFrames || activeColor !== null;
}

/* ---------- Sound effects ----------
 * Small synthesized cues (no audio files to fetch) for a card tap, a
 * successful download, and the surprise-me flourish. On by default and
 * toggled from the speaker button in the header; the choice is remembered
 * per browser via localStorage the same way the color/theme prefs are.
 * Everything routes through playTone(), which no-ops immediately if sound
 * is off, so every call site can fire-and-forget without checking the
 * toggle itself.
 */
const SOUND_PREF_KEY = 'blapples-wallpaper-sound-v1';
// On by default; only stays off across reloads if the person explicitly
// turned it off before (an explicit 'off' is the only thing that beats
// the default — anything else, including no stored value at all, means on).
let soundEnabled = true;
try{ soundEnabled = localStorage.getItem(SOUND_PREF_KEY) !== 'off'; }catch(err){}
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function playTone({freq=440, sweep=null, duration=0.12, type='sine', gain=0.05, delay=0}={}){
  if(!soundEnabled) return;
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(sweep) osc.frequency.exponentialRampToValueAtTime(Math.max(20,sweep), t0 + duration);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(g).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }catch(err){ /* Audio is best-effort; never let it break navigation. */ }
}
// A quick two-note "mew" chirp — pitch rising then falling, evoking a
// little cat sound without needing a real audio sample.
function playCardClickSound(){
  playTone({freq:520, sweep:820, duration:.08, type:'sine', gain:.05});
  playTone({freq:760, sweep:480, duration:.1, type:'sine', gain:.035, delay:.06});
}
function playDownloadSound(){
  playTone({freq:520, duration:.11, type:'triangle', gain:.05});
  playTone({freq:784, duration:.16, type:'triangle', gain:.055, delay:.09});
}
function playSurpriseTickSound(){
  playTone({freq:280 + Math.random()*140, duration:.04, type:'square', gain:.018});
}
function playSurpriseLandSound(){
  playTone({freq:440, sweep:880, duration:.22, type:'sine', gain:.05});
}

const soundToggleBtn = document.getElementById('soundToggleBtn');

  soundEnabled = on;

  if(soundToggleBtn){
    soundToggleBtn.classList.toggle('is-active', on);
    soundToggleBtn.setAttribute('aria-pressed', String(on));
    soundToggleBtn.setAttribute('aria-label', on ? 'Turn sound effects off' : 'Turn sound effects on');
  }

/* ---------- Click-triggered card pounce ----------
 * A quick squash-and-recover animation (see .card-pounce in CSS) that
 * plays the instant a card is tapped, while the lightbox is still fading
 * in over it. Removed on 'animationend' rather than via a fixed timeout so
 * a rapid re-click always restarts cleanly. */
function triggerCardPounce(card){
  if(!card) return;
  card.classList.remove('card-pounce');
  void card.offsetWidth; // restart the animation if it's already mid-run
  card.classList.add('card-pounce');
  card.addEventListener('animationend', function handler(){
    card.classList.remove('card-pounce');
    card.removeEventListener('animationend', handler);
  });
}

function hashString(str){
  let h = 0;
  for(let i=0;i<str.length;i++) h = (Math.imul(31,h) + str.charCodeAt(i)) | 0;
  return h >>> 0;
}
